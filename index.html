<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@danyapez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Press Start 2P",monospace;font-size:11px}
.app{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) 400px;background:#000}
.stage{position:relative;display:grid;place-items:center;min-height:100svh;background:#000;overflow:hidden}
#preview{width:min(100vw,calc(100svh * 16 / 9));max-width:100%;aspect-ratio:16/9;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
#camera{position:absolute;right:18px;bottom:18px;width:220px;aspect-ratio:16/9;object-fit:cover;border:1px solid rgba(255,255,255,.25);transform:scaleX(-1);display:none;background:#000}
#camera.visible{display:block}
.panel{padding:22px;background:#050505;border-left:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 6px;font-size:15px;line-height:1.45;letter-spacing:.5px}
p{margin:0;color:#8f8f8f;font-size:8px;line-height:1.8}
.buttons,.manual{display:grid;gap:9px}
.manual{grid-template-columns:1fr 1fr}
button,a,select{width:100%;border:1px solid #fff;border-radius:0;padding:13px 10px;background:transparent;color:#fff;font-family:"Press Start 2P",monospace;font-size:8px;line-height:1.45;text-align:center;text-decoration:none;cursor:pointer}
select{text-align:left;appearance:none;-webkit-appearance:none}
button:hover:not(:disabled),button:active:not(:disabled),a:hover,select:hover{background:#fff;color:#000}
button:disabled{opacity:.35;cursor:not-allowed}
.hidden{display:none!important}
label{display:grid;gap:8px;color:#fff;font-size:9px;line-height:1.6}
input[type=range]{width:100%;accent-color:#fff}
.check{grid-template-columns:18px 1fr;align-items:start}
input[type=checkbox]{margin:0;width:13px;height:13px;accent-color:#fff}
.status{border:1px solid rgba(255,255,255,.25);padding:14px;font-size:8px;line-height:2}
.status span{color:#7741F6}
.warn{display:none;border:1px solid #ffcc00;color:#ffcc00;padding:12px;font-size:8px;line-height:1.7}
.warn.visible{display:block}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand h1{margin:0}

@media(max-width:900px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .stage{min-height:0;height:38svh}
 .panel{border-left:0;border-top:1px solid rgba(255,255,255,.25);min-height:62svh;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
 #camera{width:130px;right:10px;bottom:10px}
 h1{font-size:12px} button,a,select{font-size:7px;padding:12px 9px}
}
</style>
</head>
<body>
<main class="app">
<section class="stage">
<canvas id="preview" width="1920" height="1080"></canvas>
<video id="camera" playsinline muted autoplay></video>
</section>

<aside class="panel">
<div>
<div class="brand">
<h1>@danyapez</h1>

</div>
<p>Виртуальный анимированный аватар, управляемый технологией захвата движений</p>
</div>

<div id="warn" class="warn"></div>

<div class="buttons">
<button id="start">START CAMERA</button>
<button id="rec">REC</button>
<button id="stop" disabled>STOP</button>
</div>

<a id="downloadZip" class="hidden" download>DOWNLOAD CAPCUT MP4</a>

<div class="manual">
<button data-s="static">STATIC</button>
<button data-s="open_mouth">MOUTH</button>
<button data-s="brows">BROWS</button>
<button data-s="surprised">WOW</button>
</div>

<label>EXPORT
<select id="size">
<option value="1080" selected>1920×1080 MP4 GREEN STABLE</option>
<option value="4k">3840×2160 MP4 GREEN HEAVY</option>
</select>
</label>

<label>SIZE
<input id="scale" type="range" min="0.7" max="2.6" step="0.05" value="1.55">
</label>

<label>HEAD MOVE
<input id="move" type="range" min="0" max="220" step="1" value="90">
</label>

<label>SMOOTH
<input id="smooth" type="range" min="0" max="96" step="1" value="78">
</label>

<label class="check">
<input id="showCam" type="checkbox"><span>SHOW CAMERA</span>
</label>

<div class="status">
<div>STATUS: <span id="status">WAIT</span></div>
<div>SPRITE: <span id="sprite">STATIC</span></div>
<div>PNG: <span>ORIGINAL</span></div>
<div>VIDEO: <span>MP4 #00FF00</span></div>
<div>AUDIO: <span>INSIDE MP4</span></div>
<div>EXPORT: <span id="exportInfo">3840×2160</span></div>
<div>FORMAT: <span id="format">MP4 FIX</span></div>
<div>FIX: <span id="fixStatus">WAIT</span></div>
</div>

</aside>
</main>

function setStatus(t){el.status.textContent=t}
function warn(t){el.warn.textContent=t;el.warn.classList.add("visible")}
function hideWarn(){el.warn.classList.remove("visible")}

function exportSettings(){
 if(el.size.value==="4k")return {w:3840,h:2160,br:30000000,label:"3840×2160"};
 return {w:1920,h:1080,br:12000000,label:"1920×1080"};
}

function resizeRec(){
 const s=exportSettings();
 recCanvas.width=s.w;
 recCanvas.height=s.h;
 el.exportInfo.textContent=s.label;
}

function mp4Mime(){
 const types=[
  "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
  "video/mp4;codecs=avc1.640028,mp4a.40.2",
  "video/mp4;codecs=h264,aac",
  "video/mp4"
 ];
 return types.find(t=>MediaRecorder.isTypeSupported(t))||"";
}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}

async function loadSprites(){
 const out={};
 for(const [k,u] of Object.entries(SPRITE_URLS)){
  out[k]=await loadImg(u);
 }
 sprites=out;
}

function getBlend(bs,n){const i=bs?.categories?.find(c=>c.categoryName===n);return i?i.score:0}

function volume(){
 if(!analyser||!audioData)return 0;
 analyser.getByteTimeDomainData(audioData);
 let s=0;
 for(const v of audioData){const n=(v-128)/128;s+=n*n}
 return Math.sqrt(s/audioData.length);
}

function choose(result,vol){
 const b=result?.faceBlendshapes?.[0];
 if(!b)return vol>.07?"open_mouth":stable;

 const jaw=getBlend(b,"jawOpen");
 const brow=getBlend(b,"browInnerUp");
 const smile=(getBlend(b,"mouthSmileLeft")+getBlend(b,"mouthSmileRight"))/2;
 const wide=(getBlend(b,"eyeWideLeft")+getBlend(b,"eyeWideRight"))/2;

 if(jaw>.45&&(brow>.18||wide>.18))return"surprised";
 if(brow>.34||wide>.30||smile>.35)return"brows";
 if(jaw>.13||vol>.065)return"open_mouth";
 return"static";
}

function stabilize(next){
 const now=performance.now();
 if(next!==current){current=next;since=now;return stable}
 const delay=next==="open_mouth"?35:110;
 if(now-since>delay)stable=next;
 return stable;
}

function updateHead(result){
 const lm=result?.faceLandmarks?.[0];
 if(!lm||!lm[1]){head.x*=.92;head.y*=.92;return}
 const nose=lm[1], power=Number(el.move.value);
 head.x=(.5-nose.x)*power*1.8;
 head.y=(nose.y-.5)*power*1.15;
}

function render(ctx,w,h,bg){
 ctx.imageSmoothingEnabled=false;
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,w,h);

 const sp=sprites[stable]||sprites.static;
 if(!sp)return;

 const sm=Number(el.smooth.value)/100;
 smoothHead.x=smoothHead.x*sm+head.x*(1-sm);
 smoothHead.y=smoothHead.y*sm+head.y*(1-sm);

 const f=h/1080;
 const sc=Number(el.scale.value)*f;
 const sw=Math.round(sp.naturalWidth*sc), sh=Math.round(sp.naturalHeight*sc);
 const x=Math.round(w/2-sw/2+smoothHead.x*f);
 const y=Math.round(h/2-sh/2+smoothHead.y*f);

 ctx.drawImage(sp,x,y,sw,sh);
}

async function initFace(){
 if(face)return;
 setStatus("LOAD MEDIAPIPE");
 const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
 face=await FaceLandmarker.createFromOptions(vision,{
  baseOptions:{modelAssetPath:MODEL_URL,delegate:"GPU"},
  outputFaceBlendshapes:true,
  runningMode:"VIDEO",
  numFaces:1
 });
}

async function initCamera(){
 if(!navigator.mediaDevices?.getUserMedia)throw new Error("CAMERA API NOT AVAILABLE");
 if(!window.isSecureContext)throw new Error("OPEN THROUGH HTTPS OR LOCALHOST");

 setStatus("ASK CAMERA");

 stream=await navigator.mediaDevices.getUserMedia({
  video:{width:{ideal:1280},height:{ideal:720},facingMode:"user"},
  audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
 });

 video.srcObject=stream;
 await video.play();

 micStream=new MediaStream(stream.getAudioTracks());

 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 await audioCtx.resume();

 if(micStream.getAudioTracks().length){
  const source=audioCtx.createMediaStreamSource(micStream);
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=512;
  source.connect(analyser);
  audioData=new Uint8Array(analyser.frequencyBinCount);
 }

 cameraReady=true;
}

function startWavRecord(){
 wavBuffers=[];
 if(!audioCtx||!micStream||!micStream.getAudioTracks().length)return;

 wavSampleRate=audioCtx.sampleRate;
 wavSource=audioCtx.createMediaStreamSource(micStream);
 wavProcessor=audioCtx.createScriptProcessor(4096,1,1);
 wavSilentGain=audioCtx.createGain();
 wavSilentGain.gain.value=0;

 wavProcessor.onaudioprocess=(event)=>{
  const input=event.inputBuffer.getChannelData(0);
  wavBuffers.push(new Float32Array(input));
  event.outputBuffer.getChannelData(0).fill(0);
 };

 wavSource.connect(wavProcessor);
 wavProcessor.connect(wavSilentGain);
 wavSilentGain.connect(audioCtx.destination);
}

function stopWavRecord(){
 if(wavProcessor){wavProcessor.disconnect();wavProcessor.onaudioprocess=null;wavProcessor=null;}
 if(wavSource){wavSource.disconnect();wavSource=null;}
 if(wavSilentGain){wavSilentGain.disconnect();wavSilentGain=null;}
 return encodeWav(wavBuffers,wavSampleRate);
}

function encodeWav(buffers,sampleRate){
 let length=0;
 for(const b of buffers)length+=b.length;

 const samples=new Float32Array(length);
 let offset=0;
 for(const b of buffers){samples.set(b,offset);offset+=b.length;}

 const wavBuffer=new ArrayBuffer(44+samples.length*2);
 const view=new DataView(wavBuffer);

 function writeString(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}

 writeString(0,"RIFF");
 view.setUint32(4,36+samples.length*2,true);
 writeString(8,"WAVE");
 writeString(12,"fmt ");
 view.setUint32(16,16,true);
 view.setUint16(20,1,true);
 view.setUint16(22,1,true);
 view.setUint32(24,sampleRate,true);
 view.setUint32(28,sampleRate*2,true);
 view.setUint16(32,2,true);
 view.setUint16(34,16,true);
 writeString(36,"data");
 view.setUint32(40,samples.length*2,true);

 let p=44;
 for(let i=0;i<samples.length;i++,p+=2){
  const sample=Math.max(-1,Math.min(1,samples[i]));
  view.setInt16(p,sample<0?sample*0x8000:sample*0x7fff,true);
 }

 return new Blob([view],{type:"audio/wav"});
}

function loop(){
 if(cameraReady&&video.readyState>=2&&video.currentTime!==lastVideoTime&&face){
  lastVideoTime=video.currentTime;
  const r=face.detectForVideo(video,performance.now());
  const v=volume();
  updateHead(r);
  stabilize(choose(r,v));
 } else {
  head.x*=.96;
  head.y*=.96;
 }

 render(pctx,preview.width,preview.height,"#000000");
 render(rctx,recCanvas.width,recCanvas.height,GREEN);

 el.sprite.textContent=stable.toUpperCase();
 requestAnimationFrame(loop);
}


async function loadFfmpeg(){
 if(ffmpegReady)return;
 el.fixStatus.textContent="LOAD";
 const baseURL="https://unpkg.com/@ffmpeg/core@0.12.10/dist/umd";
 await ffmpeg.load({
  coreURL:await toBlobURL(`${baseURL}/ffmpeg-core.js`,"text/javascript"),
  wasmURL:await toBlobURL(`${baseURL}/ffmpeg-core.wasm`,"application/wasm")
 });
 ffmpegReady=true;
 el.fixStatus.textContent="READY";
}

async function makeCapCutMp4(inputBlob,settings,stamp){
 try{
  setStatus("FIX MP4");
  el.fixStatus.textContent="REMUX";
  await loadFfmpeg();

  try{await ffmpeg.deleteFile("input.mp4");await ffmpeg.deleteFile("output.mp4");}catch(e){}

  await ffmpeg.writeFile("input.mp4",await fetchFile(inputBlob));

  await ffmpeg.exec([
   "-i","input.mp4",
   "-map","0:v:0",
   "-map","0:a:0?",
   "-c:v","copy",
   "-c:a","aac",
   "-b:a","160k",
   "-ar","48000",
   "-ac","2",
   "-movflags","+faststart",
   "output.mp4"
  ]);

  const fixedData=await ffmpeg.readFile("output.mp4");
  const fixedBlob=new Blob([fixedData.buffer],{type:"video/mp4"});
  el.fixStatus.textContent="DONE";
  return fixedBlob;
 }catch(e){
  console.error(e);
  el.fixStatus.textContent="RAW";
  warn("MP4 FIX FAILED. DOWNLOADING RAW MP4. "+String(e.message||e));
  return inputBlob;
 }
}

function startRec(){
 resizeRec();

 const mime=mp4Mime();
 if(!mime){
  warn("MP4 RECORDING IS NOT SUPPORTED IN THIS BROWSER. OPEN IN CHROME/EDGE DESKTOP OR SAFARI.");
  setStatus("NO MP4");
  return;
 }

 chunks=[];
 el.downloadZip.classList.add("hidden");

 const settings=exportSettings();
 const videoStream=recCanvas.captureStream(30);
 const audioTracks=micStream ? micStream.getAudioTracks() : [];

 if(!audioTracks.length){
  warn("MICROPHONE TRACK NOT FOUND. VIDEO WILL BE RECORDED WITHOUT AUDIO.");
 }

 const mixedStream=new MediaStream([
  ...videoStream.getVideoTracks(),
  ...audioTracks
 ]);

 recorder=new MediaRecorder(mixedStream,{
  mimeType:mime,
  videoBitsPerSecond:settings.br,
  audioBitsPerSecond:160000
 });

 recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};

 recorder.onstop=async()=>{
  const rawBlob=new Blob(chunks,{type:mime});
  const stamp=new Date().toISOString().replace(/[:.]/g,"-");

  const finalBlob=await makeCapCutMp4(rawBlob,settings,stamp);

  el.downloadZip.href=URL.createObjectURL(finalBlob);
  el.downloadZip.download=`danyapez_avatar_${settings.label.replace("×","x")}_capcut_${stamp}.mp4`;
  el.downloadZip.classList.remove("hidden");

  el.rec.disabled=false;
  el.stop.disabled=true;
  setStatus("READY");
 };

 recorder.start(1000);

 el.format.textContent="MP4 FIX";
 el.fixStatus.textContent="REC";
 el.rec.disabled=true;
 el.stop.disabled=false;
 setStatus("REC MP4");
}

el.start.onclick=async()=>{
 try{
  el.start.disabled=true;
  hideWarn();
  await loadSprites();
  await initFace();
  await initCamera();
  setStatus("CAMERA ON");
 }catch(e){
  console.error(e);
  el.start.disabled=false;
  cameraReady=false;
  setStatus("MANUAL MODE");
  warn(String(e.message||e)+". Open in Safari/Chrome directly.");
 }
};

el.rec.onclick=()=>{try{startRec()}catch(e){console.error(e);warn("REC ERROR: "+e.message)}};
el.stop.onclick=()=>{if(recorder&&recorder.state!=="inactive")recorder.stop()};

el.showCam.onchange=()=>video.classList.toggle("visible",el.showCam.checked);
el.size.onchange=resizeRec;

document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
 stable=b.dataset.s;
 current=stable;
 head.x=0;
 head.y=0;
});

await loadSprites();
resizeRec();
stable="static";
render(pctx,preview.width,preview.height,"#000000");
render(rctx,recCanvas.width,recCanvas.height,GREEN);
loop();
setStatus("READY");
</script>
</body>
</html>
