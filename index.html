<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@danyapez</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: "Press Start 2P", monospace;
  font-size: 11px;
}

.app {
  min-height: 100svh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 400px;
  background: #000;
}

.stage {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 100svh;
  background: #000;
  overflow: hidden;
}

#preview {
  width: min(100vw, calc(100svh * 16 / 9));
  max-width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#camera {
  position: absolute;
  right: 18px;
  bottom: 18px;
  width: 220px;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border: 1px solid rgba(255,255,255,.25);
  transform: scaleX(-1);
  display: none;
  background: #000;
}

#camera.visible {
  display: block;
}

.panel {
  padding: 22px;
  background: #050505;
  border-left: 1px solid rgba(255,255,255,.25);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

h1 {
  margin: 0;
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: .5px;
}

p {
  margin: 0;
  color: #8f8f8f;
  font-size: 8px;
  line-height: 1.8;
}

.buttons,
.manual {
  display: grid;
  gap: 9px;
}

.manual {
  grid-template-columns: 1fr 1fr;
}

button,
a,
select {
  width: 100%;
  border: 1px solid #fff;
  border-radius: 0;
  padding: 13px 10px;
  background: transparent;
  color: #fff;
  font-family: "Press Start 2P", monospace;
  font-size: 8px;
  line-height: 1.45;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

select {
  text-align: left;
  appearance: none;
  -webkit-appearance: none;
}

button:hover:not(:disabled),
button:active:not(:disabled),
a:hover,
select:hover {
  background: #fff;
  color: #000;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

label {
  display: grid;
  gap: 8px;
  color: #fff;
  font-size: 9px;
  line-height: 1.6;
}

input[type="range"] {
  width: 100%;
  accent-color: #fff;
}

.check {
  grid-template-columns: 18px 1fr;
  align-items: start;
}

input[type="checkbox"] {
  margin: 0;
  width: 13px;
  height: 13px;
  accent-color: #fff;
}

.status {
  border: 1px solid rgba(255,255,255,.25);
  padding: 14px;
  font-size: 8px;
  line-height: 2;
}

.status span {
  color: #7741F6;
}

.warn {
  display: none;
  border: 1px solid #ffcc00;
  color: #ffcc00;
  padding: 12px;
  font-size: 8px;
  line-height: 1.7;
}

.warn.visible {
  display: block;
}

@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }

  .stage {
    min-height: 0;
    height: 38svh;
  }

  .panel {
    border-left: 0;
    border-top: 1px solid rgba(255,255,255,.25);
    min-height: 62svh;
    padding: 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }

  #camera {
    width: 130px;
    right: 10px;
    bottom: 10px;
  }

  h1 {
    font-size: 12px;
  }

  button,
  a,
  select {
    font-size: 7px;
    padding: 12px 9px;
  }
}
</style>
</head>

<body>
<main class="app">
  <section class="stage">
    <canvas id="preview" width="1920" height="1080"></canvas>
    <video id="camera" playsinline muted autoplay></video>
  </section>

  <aside class="panel">
    <div>
      <div class="brand">
        <h1>@danyapez</h1>
      </div>
      <p>Виртуальный анимированный аватар, управляемый технологией захвата движений</p>
    </div>

    <div id="warn" class="warn"></div>

    <div class="buttons">
      <button id="start">START CAMERA</button>
      <button id="rec">REC</button>
      <button id="stop" disabled>STOP</button>
    </div>

    <a id="downloadMp4" class="hidden" download>DOWNLOAD MP4</a>

    <div class="manual">
      <button data-s="static">STATIC</button>
      <button data-s="open_mouth">MOUTH</button>
      <button data-s="brows">BROWS</button>
      <button data-s="surprised">WOW</button>
    </div>

    <label>
      EXPORT
      <select id="size">
        <option value="1080" selected>1920×1080 MP4 GREEN STABLE</option>
        <option value="4k">3840×2160 MP4 GREEN HEAVY</option>
      </select>
    </label>

    <label>
      SIZE
      <input id="scale" type="range" min="0.7" max="2.6" step="0.05" value="1.55">
    </label>

    <label>
      HEAD MOVE
      <input id="move" type="range" min="0" max="220" step="1" value="90">
    </label>

    <label>
      SMOOTH
      <input id="smooth" type="range" min="0" max="96" step="1" value="78">
    </label>

    <label class="check">
      <input id="showCam" type="checkbox">
      <span>SHOW CAMERA</span>
    </label>

    <div class="status">
      <div>STATUS: <span id="status">WAIT</span></div>
      <div>SPRITE: <span id="sprite">STATIC</span></div>
      <div>PNG: <span>ORIGINAL</span></div>
      <div>VIDEO: <span>MP4 #00FF00</span></div>
      <div>AUDIO: <span>INSIDE MP4</span></div>
      <div>EXPORT: <span id="exportInfo">1920×1080</span></div>
      <div>FORMAT: <span id="format">MP4</span></div>
    </div>
  </aside>
</main>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

const SPRITE_URLS = {
  open_mouth: "IMG_8077.PNG",
  brows: "IMG_8076.PNG",
  surprised: "IMG_8075.PNG",
  static: "IMG_8074.PNG"
};

const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task";
const GREEN = "#00FF00";

const preview = document.querySelector("#preview");
const previewCtx = preview.getContext("2d", { alpha: false });

const recordCanvas = document.createElement("canvas");
const recordCtx = recordCanvas.getContext("2d", { alpha: false });

const video = document.querySelector("#camera");

const el = {
  start: document.querySelector("#start"),
  rec: document.querySelector("#rec"),
  stop: document.querySelector("#stop"),
  downloadMp4: document.querySelector("#downloadMp4"),
  warn: document.querySelector("#warn"),
  status: document.querySelector("#status"),
  sprite: document.querySelector("#sprite"),
  format: document.querySelector("#format"),
  exportInfo: document.querySelector("#exportInfo"),
  scale: document.querySelector("#scale"),
  move: document.querySelector("#move"),
  smooth: document.querySelector("#smooth"),
  showCam: document.querySelector("#showCam"),
  size: document.querySelector("#size")
};

let sprites = {};
let faceLandmarker = null;
let userStream = null;
let micStream = null;
let audioCtx = null;
let analyser = null;
let audioData = null;

let recorder = null;
let chunks = [];
let lastVideoTime = -1;

let stableSprite = "static";
let currentSprite = "static";
let stableSince = performance.now();
let cameraReady = false;

let head = { x: 0, y: 0 };
let smoothHead = { x: 0, y: 0 };

function setStatus(text) {
  el.status.textContent = text;
}

function showWarning(text) {
  el.warn.textContent = text;
  el.warn.classList.add("visible");
}

function hideWarning() {
  el.warn.classList.remove("visible");
}

function getExportSettings() {
  if (el.size.value === "4k") {
    return {
      width: 3840,
      height: 2160,
      fps: 30,
      bitrate: 30000000,
      label: "3840×2160"
    };
  }

  return {
    width: 1920,
    height: 1080,
    fps: 30,
    bitrate: 12000000,
    label: "1920×1080"
  };
}

function updateExportCanvasSize() {
  const settings = getExportSettings();

  recordCanvas.width = settings.width;
  recordCanvas.height = settings.height;

  el.exportInfo.textContent = settings.label;
}

function selectMp4MimeType() {
  const types = [
    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
    "video/mp4;codecs=avc1.640028,mp4a.40.2",
    "video/mp4;codecs=h264,aac",
    "video/mp4"
  ];

  return types.find(type => MediaRecorder.isTypeSupported(type)) || "";
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();

    image.onload = () => resolve(image);

    image.onerror = () => {
      reject(new Error("Не загрузился PNG: " + src));
    };

    image.src = src;
  });
}

async function loadSprites() {
  const loaded = {};

  for (const [name, url] of Object.entries(SPRITE_URLS)) {
    loaded[name] = await loadImage(url);
  }

  sprites = loaded;
}

function getBlend(blendshapes, name) {
  const item = blendshapes?.categories?.find(category => category.categoryName === name);
  return item ? item.score : 0;
}

function getMicVolume() {
  if (!analyser || !audioData) return 0;

  analyser.getByteTimeDomainData(audioData);

  let sum = 0;

  for (const value of audioData) {
    const normalized = (value - 128) / 128;
    sum += normalized * normalized;
  }

  return Math.sqrt(sum / audioData.length);
}

function chooseSprite(result, volume) {
  const blendshapes = result?.faceBlendshapes?.[0];

  if (!blendshapes) {
    return volume > 0.07 ? "open_mouth" : stableSprite;
  }

  const jawOpen = getBlend(blendshapes, "jawOpen");
  const browInnerUp = getBlend(blendshapes, "browInnerUp");

  const smile = (
    getBlend(blendshapes, "mouthSmileLeft") +
    getBlend(blendshapes, "mouthSmileRight")
  ) / 2;

  const eyeWide = (
    getBlend(blendshapes, "eyeWideLeft") +
    getBlend(blendshapes, "eyeWideRight")
  ) / 2;

  if (jawOpen > 0.45 && (browInnerUp > 0.18 || eyeWide > 0.18)) {
    return "surprised";
  }

  if (browInnerUp > 0.34 || eyeWide > 0.30 || smile > 0.35) {
    return "brows";
  }

  if (jawOpen > 0.13 || volume > 0.065) {
    return "open_mouth";
  }

  return "static";
}

function stabilizeSprite(nextSprite) {
  const now = performance.now();

  if (nextSprite !== currentSprite) {
    currentSprite = nextSprite;
    stableSince = now;
    return stableSprite;
  }

  const delay = nextSprite === "open_mouth" ? 35 : 110;

  if (now - stableSince > delay) {
    stableSprite = nextSprite;
  }

  return stableSprite;
}

function updateHeadFromLandmarks(result) {
  const landmarks = result?.faceLandmarks?.[0];

  if (!landmarks || !landmarks[1]) {
    head.x *= 0.92;
    head.y *= 0.92;
    return;
  }

  const nose = landmarks[1];
  const power = Number(el.move.value);

  head.x = (0.5 - nose.x) * power * 1.8;
  head.y = (nose.y - 0.5) * power * 1.15;
}

function render(ctx, width, height, background) {
  ctx.imageSmoothingEnabled = false;

  ctx.fillStyle = background;
  ctx.fillRect(0, 0, width, height);

  const sprite = sprites[stableSprite] || sprites.static;
  if (!sprite) return;

  const smoothing = Number(el.smooth.value) / 100;

  smoothHead.x = smoothHead.x * smoothing + head.x * (1 - smoothing);
  smoothHead.y = smoothHead.y * smoothing + head.y * (1 - smoothing);

  const exportFactor = height / 1080;
  const scale = Number(el.scale.value) * exportFactor;

  const spriteWidth = Math.round(sprite.naturalWidth * scale);
  const spriteHeight = Math.round(sprite.naturalHeight * scale);

  const x = Math.round(width / 2 - spriteWidth / 2 + smoothHead.x * exportFactor);
  const y = Math.round(height / 2 - spriteHeight / 2 + smoothHead.y * exportFactor);

  ctx.drawImage(sprite, x, y, spriteWidth, spriteHeight);
}

async function initFaceLandmarker() {
  if (faceLandmarker) return;

  setStatus("LOAD MEDIAPIPE");

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: MODEL_URL,
      delegate: "GPU"
    },
    outputFaceBlendshapes: true,
    runningMode: "VIDEO",
    numFaces: 1
  });
}

async function initCameraAndMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("CAMERA API IS NOT AVAILABLE IN THIS BROWSER");
  }

  if (!window.isSecureContext) {
    throw new Error("OPEN THROUGH HTTPS OR LOCALHOST");
  }

  setStatus("ASK CAMERA");

  userStream = await navigator.mediaDevices.getUserMedia({
    video: {
      width: { ideal: 1280 },
      height: { ideal: 720 },
      facingMode: "user"
    },
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  });

  video.srcObject = userStream;
  await video.play();

  const audioTracks = userStream.getAudioTracks();
  micStream = new MediaStream(audioTracks);

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();

  if (audioTracks.length) {
    const source = audioCtx.createMediaStreamSource(micStream);

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;

    source.connect(analyser);

    audioData = new Uint8Array(analyser.frequencyBinCount);
  }

  cameraReady = true;
}

function loop() {
  if (
    cameraReady &&
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime &&
    faceLandmarker
  ) {
    lastVideoTime = video.currentTime;

    const result = faceLandmarker.detectForVideo(video, performance.now());
    const volume = getMicVolume();

    updateHeadFromLandmarks(result);

    const nextSprite = chooseSprite(result, volume);
    stabilizeSprite(nextSprite);
  } else {
    head.x *= 0.96;
    head.y *= 0.96;
  }

  render(previewCtx, preview.width, preview.height, "#000000");
  render(recordCtx, recordCanvas.width, recordCanvas.height, GREEN);

  el.sprite.textContent = stableSprite.toUpperCase();

  requestAnimationFrame(loop);
}

function startRecording() {
  updateExportCanvasSize();

  const mimeType = selectMp4MimeType();

  if (!mimeType) {
    showWarning("MP4 RECORDING IS NOT SUPPORTED IN THIS BROWSER. OPEN IN CHROME / EDGE / SAFARI DESKTOP.");
    setStatus("NO MP4");
    return;
  }

  chunks = [];

  el.downloadMp4.classList.add("hidden");
  el.downloadMp4.removeAttribute("href");

  const settings = getExportSettings();

  const canvasStream = recordCanvas.captureStream(settings.fps);
  const audioTracks = micStream ? micStream.getAudioTracks() : [];

  if (!audioTracks.length) {
    showWarning("MICROPHONE TRACK NOT FOUND. VIDEO WILL BE RECORDED WITHOUT AUDIO.");
  }

  const mixedStream = new MediaStream([
    ...canvasStream.getVideoTracks(),
    ...audioTracks
  ]);

  recorder = new MediaRecorder(mixedStream, {
    mimeType,
    videoBitsPerSecond: settings.bitrate,
    audioBitsPerSecond: 128000
  });

  recorder.ondataavailable = event => {
    if (event.data && event.data.size > 0) {
      chunks.push(event.data);
    }
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");

    el.downloadMp4.href = url;
    el.downloadMp4.download = `danyapez_avatar_${settings.label.replace("×", "x")}_audio_sync_${stamp}.mp4`;
    el.downloadMp4.classList.remove("hidden");

    el.rec.disabled = false;
    el.stop.disabled = true;

    setStatus("READY");
  };

  recorder.start(1000);

  el.format.textContent = "MP4";

  el.rec.disabled = true;
  el.stop.disabled = false;

  setStatus("REC MP4");
}

el.start.addEventListener("click", async () => {
  try {
    el.start.disabled = true;
    hideWarning();

    await loadSprites();
    await initFaceLandmarker();
    await initCameraAndMic();

    setStatus("CAMERA ON");
  } catch (error) {
    console.error(error);

    cameraReady = false;
    el.start.disabled = false;

    setStatus("MANUAL MODE");

    const message = String(error && error.message ? error.message : error);

    showWarning(
      message + ". Open in Safari / Chrome directly, not inside Telegram. Manual buttons still work."
    );
  }
});

el.rec.addEventListener("click", () => {
  try {
    startRecording();
  } catch (error) {
    console.error(error);
    showWarning("REC ERROR: " + error.message);
  }
});

el.stop.addEventListener("click", () => {
  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }
});

el.showCam.addEventListener("change", () => {
  video.classList.toggle("visible", el.showCam.checked);
});

el.size.addEventListener("change", () => {
  updateExportCanvasSize();
});

document.querySelectorAll("[data-s]").forEach(button => {
  button.addEventListener("click", () => {
    stableSprite = button.dataset.s;
    currentSprite = stableSprite;
    head.x = 0;
    head.y = 0;
  });
});

await loadSprites();

updateExportCanvasSize();

stableSprite = "static";

render(previewCtx, preview.width, preview.height, "#000000");
render(recordCtx, recordCanvas.width, recordCanvas.height, GREEN);

loop();

setStatus("READY");
</script>
</body>
</html>
