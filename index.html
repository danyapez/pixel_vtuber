<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@danyapez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Press Start 2P",monospace;font-size:11px}
.app{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) 400px;background:#000}
.stage{position:relative;display:grid;place-items:center;min-height:100svh;background:#000;overflow:hidden}
#preview{width:min(100vw,calc(100svh * 16 / 9));max-width:100%;aspect-ratio:16/9;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
#camera{position:absolute;right:18px;bottom:18px;width:220px;aspect-ratio:16/9;object-fit:cover;border:1px solid rgba(255,255,255,.25);transform:scaleX(-1);display:none;background:#000}
#camera.visible{display:block}
.panel{padding:22px;background:#050505;border-left:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 6px;font-size:15px;line-height:1.45;letter-spacing:.5px}
p{margin:0;color:#8f8f8f;font-size:8px;line-height:1.8}
.buttons,.manual{display:grid;gap:9px}
.manual{grid-template-columns:1fr 1fr}
button,a,select{width:100%;border:1px solid #fff;border-radius:0;padding:13px 10px;background:transparent;color:#fff;font-family:"Press Start 2P",monospace;font-size:8px;line-height:1.45;text-align:center;text-decoration:none;cursor:pointer}
select{text-align:left;appearance:none;-webkit-appearance:none}
button:hover:not(:disabled),button:active:not(:disabled),a:hover,select:hover{background:#fff;color:#000}
button:disabled{opacity:.35;cursor:not-allowed}
.hidden{display:none!important}
label{display:grid;gap:8px;color:#fff;font-size:9px;line-height:1.6}
input[type=range]{width:100%;accent-color:#fff}
.check{grid-template-columns:18px 1fr;align-items:start}
input[type=checkbox]{margin:0;width:13px;height:13px;accent-color:#fff}
.status{border:1px solid rgba(255,255,255,.25);padding:14px;font-size:8px;line-height:2}
.status span{color:#7741F6}
.warn{display:none;border:1px solid #ffcc00;color:#ffcc00;padding:12px;font-size:8px;line-height:1.7}
.warn.visible{display:block}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand h1{margin:0}

.voice-box,.teleprompter-reader{border:1px solid rgba(255,255,255,.25);padding:12px;display:grid;gap:10px}
.teleprompter-editor{display:grid;gap:10px}
.block-title{color:#7741F6;font-size:8px;line-height:1.6}
#voiceFxToggle.active{background:#7741F6;border-color:#7741F6}
.small-note{color:#777;font:11px/1.45 Arial,sans-serif}
.teleprompter-editor textarea{width:100%;min-height:120px;resize:vertical;border:1px solid rgba(255,255,255,.35);background:#000;color:#fff;padding:12px;font:16px/1.5 Arial,sans-serif}
.teleprompter-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#aiRec.active{background:#7741F6;border-color:#7741F6}
.teleprompter-reader{position:sticky;top:8px;z-index:5;height:245px;overflow:hidden;background:#000;border-color:#7741F6;box-shadow:0 8px 30px rgba(0,0,0,.85)}
.teleprompter-reader.speaking{border-color:#24c86a}
.teleprompter-reader-head{display:flex;justify-content:space-between;gap:10px;color:#7741F6;font-size:7px;line-height:1.5}
.teleprompter-reader.speaking .teleprompter-reader-head{color:#24c86a}
.teleprompter-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;cursor:grab;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.teleprompter-scroll::-webkit-scrollbar{display:none}
.teleprompter-text{padding:72px 14px 190px;white-space:pre-wrap;font:700 27px/1.48 Arial,sans-serif;text-align:center}
.teleprompter-text .tp-word{opacity:.34;transition:opacity .16s,color .16s,background .16s}
.teleprompter-text .tp-word.spoken{opacity:.58;color:#aaa}
.teleprompter-text .tp-word.current{opacity:1;color:#fff;background:#7741F6;box-shadow:0 0 0 3px #7741F6}

@media(max-width:900px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .stage{min-height:0;height:38svh}
 .panel{border-left:0;border-top:1px solid rgba(255,255,255,.25);min-height:62svh;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
 #camera{width:130px;right:10px;bottom:10px}
 h1{font-size:12px} button,a,select{font-size:7px;padding:12px 9px}
 .teleprompter-reader{top:4px;height:225px}
 .teleprompter-text{font-size:24px}
}
@media(max-width:520px){.teleprompter-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<section class="stage">
<canvas id="preview" width="1920" height="1080"></canvas>
<video id="camera" playsinline muted autoplay></video>
</section>

<aside class="panel">
<div>
<div class="brand">
<h1>@danyapez</h1>

</div>
</div>

<div id="warn" class="warn"></div>

<button id="voiceFxToggle" type="button">ГОЛОС AI: ВКЛ</button>
<input id="voiceDepth" type="hidden" value="0.25">

<div class="teleprompter-editor" id="teleprompterEditor">
<div class="block-title">ТЕЛЕСУФЛЁР</div>
<textarea id="teleprompterInput" placeholder="Вставьте сюда текст. Нажмите REC AI, и аватар сам его озвучит обработанным голосом."></textarea>
<button id="teleprompterDelete" type="button">УДАЛИТЬ ТЕКСТ</button>
</div>

<div class="teleprompter-reader hidden" id="teleprompterReader">
<div class="teleprompter-reader-head"><span>ТЕЛЕСУФЛЁР</span><span id="teleprompterState">ЖДУ ГОЛОС</span></div>
<div class="teleprompter-scroll" id="teleprompterScroll"><div class="teleprompter-text" id="teleprompterText"></div></div>
<button id="teleprompterClose" type="button">ЗАКРЫТЬ</button>
</div>

<div class="buttons">
<button id="start">START CAMERA</button>
<div class="rec-grid">
<button id="rec">REC</button>
<button id="aiRec">REC AI</button>
</div>
<button id="stop" disabled>STOP</button>
</div>

<a id="downloadZip" class="hidden" download>DOWNLOAD MP4</a>

<div class="block-title">НАСТРОЙКИ</div>

<label>РАЗМЕР
<input id="scale" type="range" min="0.7" max="2.6" step="0.05" value="1.55">
</label>

<label>ДВИЖЕНИЕ ГОЛОВЫ
<input id="move" type="range" min="0" max="220" step="1" value="90">
</label>

<label>ПЛАВНОСТЬ
<input id="smooth" type="range" min="0" max="96" step="1" value="78">
</label>

<label class="check">
<input id="showCam" type="checkbox"><span>ПОКАЗАТЬ КАМЕРУ</span>
</label>

<div class="hidden">
  <span id="status">WAIT</span>
  <span id="sprite">STATIC</span>
  <span id="exportInfo">1920×1080</span>
  <span id="format">MP4</span>
</div>

</aside>
</main>

const EDGE_TTS_API="https://innoai-edge-tts-text-to-speech.hf.space/gradio_api/call/tts_interface";
const EDGE_TTS_VOICE="de-DE-FlorianMultilingualNeural - de-DE (Male)";

const edgeTTSWait=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));

async function edgeTTSFetch(url,options={},attempts=3){
 let lastError;
 for(let attempt=0;attempt<attempts;attempt++){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),120000);
  try{
   const response=await fetch(url,{...options,signal:controller.signal});
   clearTimeout(timer);
   if(response.ok)return response;
   lastError=new Error("AI VOICE SERVER "+response.status);
  }catch(error){clearTimeout(timer);lastError=error}
  if(attempt<attempts-1)await edgeTTSWait(1800+attempt*2200);
 }
 throw lastError||new Error("AI VOICE NETWORK ERROR");
}

async function synthesizeText(text){
 const submission=await edgeTTSFetch(EDGE_TTS_API,{
  method:"POST",headers:{"Content-Type":"application/json"},
  // The Friday reference used Florian at +20% rate and about +21 Hz pitch.
  // Let Edge TTS create that pitch natively so the voice stays clean and human.
  body:JSON.stringify({data:[text,EDGE_TTS_VOICE,20,21]})
 });
 const submitted=await submission.json();
 if(!submitted.event_id)throw new Error("AI VOICE START ERROR");

 const eventResponse=await edgeTTSFetch(`${EDGE_TTS_API}/${submitted.event_id}`,{headers:{Accept:"text/event-stream"}},2);
 const eventText=await eventResponse.text();
 if(/event:\s*error/i.test(eventText))throw new Error("AI VOICE SERVER ERROR");
 const complete=eventText.match(/event:\s*complete\s*[\r\n]+data:\s*(.+)/i);
 if(!complete)throw new Error("AI VOICE EMPTY RESPONSE");
 const result=JSON.parse(complete[1]);
 const audioUrl=result?.[0]?.url;
 if(!audioUrl)throw new Error("AI VOICE AUDIO NOT FOUND");

 const audioResponse=await edgeTTSFetch(audioUrl,{},2);
 const mp3=await audioResponse.arrayBuffer();
 const decoded=await audioCtx.decodeAudioData(mp3.slice(0));
 const samples=new Float32Array(decoded.length);
 if(decoded.numberOfChannels===1)samples.set(decoded.getChannelData(0));
 else for(let channel=0;channel<decoded.numberOfChannels;channel++){
  const data=decoded.getChannelData(channel);
  for(let index=0;index<data.length;index++)samples[index]+=data[index]/decoded.numberOfChannels;
 }
 return {samples,sampleRate:decoded.sampleRate};
}

function buildAIEnvelope(samples,sampleRate){
 const frameSize=Math.max(128,Math.round(sampleRate*aiEnvelopeStep));
 const frameCount=Math.max(1,Math.ceil(samples.length/frameSize));
 const envelope=new Float32Array(frameCount);
 let peak=.00001;
 for(let frame=0;frame<frameCount;frame++){
  const start=frame*frameSize,end=Math.min(samples.length,start+frameSize);
  let sum=0;
  for(let index=start;index<end;index++)sum+=samples[index]*samples[index];
  const rms=Math.sqrt(sum/Math.max(1,end-start));
  envelope[frame]=rms;if(rms>peak)peak=rms;
 }
 for(let frame=0;frame<frameCount;frame++)envelope[frame]=Math.sqrt(Math.min(1,envelope[frame]/peak));
 return envelope;
}

 if(now>aiMotionTime){
  aiMotionTime=now+240+Math.random()*380;
  if(playing&&Math.random()<.14){stable=Math.random()<.62?"brows":"surprised";aiMouthUntil=now+80}
 }
 if(now>aiMouthUntil){
  if(playing&&aiLastEnergy>.075){stable=Math.random()<.9?"open_mouth":"brows";aiMouthUntil=now+48+Math.random()*82}
  else{stable=playing&&Math.random()<.08?"brows":"static";aiMouthUntil=now+70}
 }
 current=stable;
}

function saveTeleprompter(){
 localStorage.setItem("danyapezTeleprompterText",el.teleprompterInput.value);
}

function prepareAITeleprompter(text){
 el.teleprompterText.textContent="";
 aiTeleprompterWords=[];aiTeleprompterWeights=[];aiTeleprompterTotalWeight=0;aiTeleprompterWordIndex=-1;
 const parts=text.match(/\S+|\s+/g)||[];
 for(const part of parts){
  if(/^\s+$/.test(part)){el.teleprompterText.append(document.createTextNode(part));continue}
  const word=document.createElement("span");word.className="tp-word";word.textContent=part;el.teleprompterText.append(word);aiTeleprompterWords.push(word);
  const punctuation=(part.match(/[.!?…]/g)||[]).length*5+(part.match(/[,;:—-]/g)||[]).length*2;
  aiTeleprompterTotalWeight+=Math.max(2,part.replace(/[^\p{L}\p{N}]/gu,"").length)+punctuation;
  aiTeleprompterWeights.push(aiTeleprompterTotalWeight);
 }
}

function updateAITeleprompterProgress(progress){
 if(!aiTeleprompterWords.length)return;
 const target=Math.max(0,Math.min(aiTeleprompterTotalWeight,progress*aiTeleprompterTotalWeight));
 let low=0,high=aiTeleprompterWeights.length-1;
 while(low<high){const middle=(low+high)>>1;if(aiTeleprompterWeights[middle]<target)low=middle+1;else high=middle}
 const nextIndex=low;
 if(nextIndex!==aiTeleprompterWordIndex){
  for(let i=0;i<aiTeleprompterWords.length;i++)aiTeleprompterWords[i].className="tp-word"+(i<nextIndex?" spoken":i===nextIndex?" current":"");
  aiTeleprompterWordIndex=nextIndex;
 }
 const word=aiTeleprompterWords[nextIndex];
 const wanted=word.offsetTop-el.teleprompterScroll.clientHeight*.42+word.offsetHeight*.5;
 const maxScroll=Math.max(0,el.teleprompterScroll.scrollHeight-el.teleprompterScroll.clientHeight);
 el.teleprompterScroll.scrollTop+=(Math.max(0,Math.min(maxScroll,wanted))-el.teleprompterScroll.scrollTop)*.18;
}

function openTeleprompter(reset=true){
 const text=el.teleprompterInput.value.trim();
 if(!text){warn("ВСТАВЬТЕ ТЕКСТ В ТЕЛЕСУФЛЁР.");return false}
 saveTeleprompter();
 if(aiMode)prepareAITeleprompter(text);else el.teleprompterText.textContent=text;
 if(reset)el.teleprompterScroll.scrollTop=0;
 el.teleprompterEditor.classList.add("hidden");el.teleprompterReader.classList.remove("hidden");
 el.teleprompterState.textContent=aiMode?"AI • СТАРТ":"ЖДУ ГОЛОС";teleprompterActive=true;teleprompterLastFrame=performance.now();
 return true;
}
function closeTeleprompter(){
 teleprompterActive=false;el.teleprompterReader.classList.add("hidden");el.teleprompterReader.classList.remove("speaking");el.teleprompterEditor.classList.remove("hidden");
}
function deleteTeleprompter(){
 el.teleprompterInput.value="";el.teleprompterText.textContent="";localStorage.removeItem("danyapezTeleprompterText");closeTeleprompter();setStatus("TEXT DELETED");
}
let teleprompterNoiseFloor=.006;
function updateTeleprompter(vol,now){
 if(!teleprompterActive){teleprompterLastFrame=now;return}
 const dt=Math.min(80,Math.max(0,now-teleprompterLastFrame));teleprompterLastFrame=now;
 if(aiMode&&aiTeleprompterDuration>0&&audioCtx){
  const elapsed=audioCtx.currentTime-aiTeleprompterStartAt;
  const progress=Math.max(0,Math.min(1,elapsed/aiTeleprompterDuration));
  const speaking=elapsed>=0&&progress<1;
  el.teleprompterReader.classList.toggle("speaking",speaking);
  el.teleprompterState.textContent=elapsed<0?"AI • СТАРТ":progress>=1?"КОНЕЦ":`AI • ${Math.round(progress*100)}%`;
  updateAITeleprompterProgress(progress);
  return;
 }
 if(vol<.035)teleprompterNoiseFloor=teleprompterNoiseFloor*.985+vol*.015;
 const gate=Math.max(.014,teleprompterNoiseFloor*2.25);
 if(vol>gate)teleprompterSpeakingUntil=now+420;
 const speaking=now<teleprompterSpeakingUntil;
 el.teleprompterReader.classList.toggle("speaking",speaking);
 el.teleprompterState.textContent=speaking?"СЛУШАЮ • AUTO":"ПАУЗА";
 if(speaking&&now>teleprompterManualUntil){
  const speed=38;
  el.teleprompterScroll.scrollTop+=speed*dt/1000;
  if(el.teleprompterScroll.scrollTop+el.teleprompterScroll.clientHeight>=el.teleprompterScroll.scrollHeight-3)el.teleprompterState.textContent="КОНЕЦ";
 }
}

async function initCamera(){
 if(!navigator.mediaDevices?.getUserMedia)throw new Error("CAMERA API NOT AVAILABLE");
 if(!window.isSecureContext)throw new Error("OPEN THROUGH HTTPS OR LOCALHOST");

 setStatus("ASK CAMERA");

 stream=await navigator.mediaDevices.getUserMedia({
  video:{width:{ideal:1280},height:{ideal:720},facingMode:"user"},
  audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,sampleRate:{ideal:44100},channelCount:{ideal:1}}
 });

 video.srcObject=stream;
 await video.play();

 micStream=new MediaStream(stream.getAudioTracks());

 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:44100});
 }catch(e){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 }
 await audioCtx.resume();

 if(micStream.getAudioTracks().length){
  const source=audioCtx.createMediaStreamSource(micStream);
  await buildVoiceGraph(source);
 }

 cameraReady=true;
}

function startWavRecord(){
 wavBuffers=[];
 if(!audioCtx||!micStream||!micStream.getAudioTracks().length)return;

 wavSampleRate=audioCtx.sampleRate;
 wavSource=audioCtx.createMediaStreamSource(micStream);
 wavProcessor=audioCtx.createScriptProcessor(4096,1,1);
 wavSilentGain=audioCtx.createGain();
 wavSilentGain.gain.value=0;

 wavProcessor.onaudioprocess=(event)=>{
  const input=event.inputBuffer.getChannelData(0);
  wavBuffers.push(new Float32Array(input));
  event.outputBuffer.getChannelData(0).fill(0);
 };

 wavSource.connect(wavProcessor);
 wavProcessor.connect(wavSilentGain);
 wavSilentGain.connect(audioCtx.destination);
}

function stopWavRecord(){
 if(wavProcessor){wavProcessor.disconnect();wavProcessor.onaudioprocess=null;wavProcessor=null;}
 if(wavSource){wavSource.disconnect();wavSource=null;}
 if(wavSilentGain){wavSilentGain.disconnect();wavSilentGain=null;}
 return encodeWav(wavBuffers,wavSampleRate);
}

function encodeWav(buffers,sampleRate){
 let length=0;
 for(const b of buffers)length+=b.length;

 const samples=new Float32Array(length);
 let offset=0;
 for(const b of buffers){samples.set(b,offset);offset+=b.length;}

 const wavBuffer=new ArrayBuffer(44+samples.length*2);
 const view=new DataView(wavBuffer);

 function writeString(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}

 writeString(0,"RIFF");
 view.setUint32(4,36+samples.length*2,true);
 writeString(8,"WAVE");
 writeString(12,"fmt ");
 view.setUint32(16,16,true);
 view.setUint16(20,1,true);
 view.setUint16(22,1,true);
 view.setUint32(24,sampleRate,true);
 view.setUint32(28,sampleRate*2,true);
 view.setUint16(32,2,true);
 view.setUint16(34,16,true);
 writeString(36,"data");
 view.setUint32(40,samples.length*2,true);

 let p=44;
 for(let i=0;i<samples.length;i++,p+=2){
  const sample=Math.max(-1,Math.min(1,samples[i]));
  view.setInt16(p,sample<0?sample*0x8000:sample*0x7fff,true);
 }

 return new Blob([view],{type:"audio/wav"});
}

function loop(){
 const now=performance.now();
 const v=volume();
 if(aiMode){
  updateAIMotion(now,v);
 }else if(cameraReady&&video.readyState>=2&&video.currentTime!==lastVideoTime&&face){
  lastVideoTime=video.currentTime;
  const r=face.detectForVideo(video,now);
  updateHead(r);
  stabilize(choose(r,v));
 } else {
  head.x*=.96;
  head.y*=.96;
 }
 updateTeleprompter(v,now);

 render(pctx,preview.width,preview.height,"#000000");
 render(rctx,recCanvas.width,recCanvas.height,GREEN);

 el.sprite.textContent=stable.toUpperCase();
 requestAnimationFrame(loop);
}

function startRec(audioTracksOverride=null,tag="AGENT_Z"){
 resizeRec();

 const mime=mp4Mime();
 if(!mime){
  warn("MP4 RECORDING IS NOT SUPPORTED IN THIS BROWSER. OPEN IN CHROME/EDGE DESKTOP OR SAFARI.");
  setStatus("NO MP4");
  return false;
 }

 chunks=[];
 el.downloadZip.classList.add("hidden");

 const settings=exportSettings();
 const videoStream=recCanvas.captureStream(30);
 const audioTracks=audioTracksOverride||(recorderAudioDestination?recorderAudioDestination.stream.getAudioTracks():(micStream?micStream.getAudioTracks():[]));

 if(!audioTracks.length){
  warn("MICROPHONE TRACK NOT FOUND. VIDEO WILL BE RECORDED WITHOUT AUDIO.");
 }

 // Один поток: canvas-видео + микрофон. Так звук и видео стартуют вместе.
 const mixedStream=new MediaStream([
  ...videoStream.getVideoTracks(),
  ...audioTracks
 ]);

 recorder=new MediaRecorder(mixedStream,{
  mimeType:mime,
  videoBitsPerSecond:settings.br,
  audioBitsPerSecond:192000
 });

 recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};

 recorder.onstop=()=>{
  closeTeleprompter();
  const blob=new Blob(chunks,{type:mime});
  const stamp=new Date().toISOString().replace(/[:.]/g,"-");

  el.downloadZip.href=URL.createObjectURL(blob);
  el.downloadZip.download=`danyapez_avatar_${tag}_${settings.label.replace("×","x")}_${stamp}.mp4`;
  el.downloadZip.classList.remove("hidden");
  setTimeout(()=>el.downloadZip.click(),120);

  el.rec.disabled=false;
  el.aiRec.disabled=false;
  el.stop.disabled=true;
  if(aiMode)finishAI();
  setStatus("READY");
 };

 // Более крупные куски обычно стабильнее для монтажа, чем частая нарезка.
 recorder.start(1000);
 if(el.teleprompterInput.value.trim())openTeleprompter(true);

 el.format.textContent="MP4";
 el.rec.disabled=true;
 el.aiRec.disabled=true;
 el.stop.disabled=false;
 setStatus("REC MP4");
 return true;
}

el.teleprompterInput.value=localStorage.getItem("danyapezTeleprompterText")||"";
el.teleprompterInput.addEventListener("input",saveTeleprompter);
el.teleprompterDelete.onclick=deleteTeleprompter;
el.teleprompterClose.onclick=closeTeleprompter;

let teleDrag=false,teleStartY=0,teleStartScroll=0;
el.teleprompterScroll.addEventListener("pointerdown",e=>{
 teleDrag=true;teleStartY=e.clientY;teleStartScroll=el.teleprompterScroll.scrollTop;teleprompterManualUntil=performance.now()+2500;
 try{el.teleprompterScroll.setPointerCapture(e.pointerId)}catch(_){}
});
el.teleprompterScroll.addEventListener("pointermove",e=>{
 if(!teleDrag)return;el.teleprompterScroll.scrollTop=teleStartScroll-(e.clientY-teleStartY);teleprompterManualUntil=performance.now()+2500;
});
el.teleprompterScroll.addEventListener("pointerup",()=>teleDrag=false);
el.teleprompterScroll.addEventListener("pointercancel",()=>teleDrag=false);

voiceFxEnabled=localStorage.getItem("danyapezAgentZFx")!=="0";
el.voiceDepth.value=localStorage.getItem("danyapezAgentZDepthV4")||"0.25";
setVoiceFxEnabled(voiceFxEnabled);setVoiceDepth(el.voiceDepth.value);
el.voiceFxToggle.onclick=()=>{setVoiceFxEnabled(!voiceFxEnabled);if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume()};
el.voiceDepth.addEventListener("input",()=>setVoiceDepth(el.voiceDepth.value));

el.start.onclick=async()=>{
 try{
  el.start.disabled=true;
  hideWarn();
  await loadSprites();
  await initFace();
  await initCamera();
  setStatus("CAMERA ON");
 }catch(e){
  console.error(e);
  el.start.disabled=false;
  cameraReady=false;
  setStatus("MANUAL MODE");
  warn(String(e.message||e)+". Open in Safari/Chrome directly.");
 }
};

el.rec.onclick=()=>{try{hideWarn();startRec()}catch(e){console.error(e);warn("REC ERROR: "+e.message)}};
el.aiRec.onclick=async()=>{
 try{await startAIRecording()}
 catch(e){console.error(e);finishAI();el.aiRec.disabled=false;el.rec.disabled=false;el.stop.disabled=true;warn(String(e.message||e));setStatus("AI ERROR")}
};
el.stop.onclick=()=>{
 aiStopRequested=true;
 if(aiAudioSource){try{aiAudioSource.stop()}catch(_){}}
 if(recorder&&recorder.state!=="inactive")recorder.stop();else if(aiMode)finishAI();
};

el.showCam.onchange=()=>video.classList.toggle("visible",el.showCam.checked);

await loadSprites();
resizeRec();
stable="static";
render(pctx,preview.width,preview.height,"#000000");
render(rctx,recCanvas.width,recCanvas.height,GREEN);
loop();
setStatus("READY");
</script>
