<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel VTuber Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #000;
  --panel: #050505;
  --text: #fff;
  --muted: #8f8f8f;
  --line: rgba(255,255,255,.22);
  --green: #00FF00;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Press Start 2P", monospace;
  font-size: 11px;
}

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  background: #000;
}

.stage {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 100vh;
  background: #000;
  overflow: hidden;
}

#stage {
  width: min(100vw, calc(100vh * 16 / 9));
  max-width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#camera {
  position: absolute;
  right: 18px;
  bottom: 18px;
  width: 220px;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border: 1px solid var(--line);
  transform: scaleX(-1);
  display: none;
  background: #000;
}

#camera.visible {
  display: block;
}

.panel {
  padding: 22px;
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

h1 {
  margin: 0 0 6px;
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: .5px;
}

.subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.7;
}

.buttons {
  display: grid;
  gap: 10px;
}

button, .download {
  width: 100%;
  border: 1px solid #fff;
  border-radius: 0;
  padding: 13px 12px;
  background: transparent;
  color: #fff;
  font-family: "Press Start 2P", monospace;
  font-size: 9px;
  line-height: 1.4;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  transition: background .15s linear, color .15s linear, opacity .15s linear;
}

button:hover:not(:disabled),
.download:hover {
  background: #fff;
  color: #000;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.download {
  display: block;
}

.hidden {
  display: none !important;
}

.control {
  display: grid;
  gap: 9px;
  color: #fff;
  font-size: 9px;
  line-height: 1.6;
}

input[type="range"] {
  width: 100%;
  accent-color: #fff;
}

.check {
  display: grid;
  grid-template-columns: 18px 1fr;
  align-items: start;
  gap: 8px;
  color: #fff;
  font-size: 9px;
  line-height: 1.6;
}

input[type="checkbox"] {
  margin: 0;
  width: 13px;
  height: 13px;
  accent-color: #fff;
}

.status {
  border: 1px solid var(--line);
  padding: 14px;
  font-size: 8px;
  line-height: 2;
  color: #fff;
}

.status span {
  color: var(--green);
}

.note {
  margin: auto 0 0;
  color: var(--muted);
  font-size: 8px;
  line-height: 1.8;
}

.mobileHint {
  display: none;
}

@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
  }

  .stage {
    min-height: auto;
    height: 58vh;
  }

  #stage {
    width: 100vw;
    height: auto;
  }

  .panel {
    border-left: 0;
    border-top: 1px solid var(--line);
    min-height: 42vh;
  }

  #camera {
    width: 150px;
    right: 10px;
    bottom: 10px;
  }

  .mobileHint {
    display: block;
  }
}

@media (max-width: 520px) {
  html, body {
    font-size: 10px;
  }

  .stage {
    height: 48vh;
  }

  .panel {
    padding: 14px;
    gap: 12px;
  }

  h1 {
    font-size: 12px;
  }

  button, .download {
    padding: 12px 10px;
    font-size: 8px;
  }
}
</style>
</head>
<body>
<main class="app">
  <section class="stage">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <video id="camera" playsinline muted></video>
  </section>

  <aside class="panel">
    <div>
      <h1>PIXEL VTUBER</h1>
      <p class="subtitle">preview black / export #00FF00</p>
    </div>

    <div class="buttons">
      <button id="btnStart">START CAMERA</button>
      <button id="btnRecord" disabled>REC</button>
      <button id="btnStop" disabled>STOP</button>
    </div>

    <a id="download" class="download hidden" download>DOWNLOAD VIDEO</a>

    <label class="control">
      SIZE
      <input id="scale" type="range" min="0.7" max="2.6" step="0.05" value="1.55">
    </label>

    <label class="control">
      HEAD MOVE
      <input id="move" type="range" min="0" max="220" step="1" value="90">
    </label>

    <label class="control">
      SMOOTH
      <input id="smooth" type="range" min="0" max="96" step="1" value="78">
    </label>

    <label class="check">
      <input id="showCamera" type="checkbox">
      <span>SHOW CAMERA</span>
    </label>

    <div class="status">
      <div>STATUS: <span id="status">WAIT</span></div>
      <div>SPRITE: <span id="emotion">STATIC</span></div>
      <div>EXPORT BG: <span>#00FF00</span></div>
      <div>FORMAT: <span id="format">—</span></div>
    </div>

    <p class="note">
      Use GitHub Pages or localhost. The preview stays black. The recorded file uses green background only.
      <span class="mobileHint"> On mobile, allow camera and mic permissions.</span>
    </p>
  </aside>
</main>

  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function isBlack(data, idx) {
  return data[idx] < 12 && data[idx + 1] < 12 && data[idx + 2] < 12 && data[idx + 3] > 0;
}

function makeBlackBackgroundTransparent(img) {
  const c = document.createElement("canvas");
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;

  const cctx = c.getContext("2d");
  cctx.imageSmoothingEnabled = false;
  cctx.drawImage(img, 0, 0);

  const imageData = cctx.getImageData(0, 0, c.width, c.height);
  const data = imageData.data;
  const w = c.width;
  const h = c.height;
  const visited = new Uint8Array(w * h);
  const stack = [];

  function push(x, y) {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const p = y * w + x;
    if (visited[p]) return;
    const idx = p * 4;
    if (!isBlack(data, idx)) return;
    visited[p] = 1;
    stack.push(p);
  }

  for (let x = 0; x < w; x++) {
    push(x, 0);
    push(x, h - 1);
  }

  for (let y = 0; y < h; y++) {
    push(0, y);
    push(w - 1, y);
  }

  while (stack.length) {
    const p = stack.pop();
    const x = p % w;
    const y = Math.floor(p / w);
    const idx = p * 4;
    data[idx + 3] = 0;

    push(x + 1, y);
    push(x - 1, y);
    push(x, y + 1);
    push(x, y - 1);
  }

  cctx.putImageData(imageData, 0, 0);
  return c;
}

async function loadSprites() {
  setStatus("LOAD SPRITES");

  const loaded = {};

  for (const [name, url] of Object.entries(SPRITE_URLS)) {
    const img = await loadImage(url);
    loaded[name] = makeBlackBackgroundTransparent(img);
  }

  sprites = loaded;
}

function getBlend(blendshapes, name) {
  const item = blendshapes?.categories?.find(c => c.categoryName === name);
  return item ? item.score : 0;
}

function getMicVolume() {
  if (!analyser || !audioData) return 0;

  analyser.getByteTimeDomainData(audioData);

  let sum = 0;
  for (const v of audioData) {
    const n = (v - 128) / 128;
    sum += n * n;
  }

  return Math.sqrt(sum / audioData.length);
}

function chooseSprite(result, volume) {
  const b = result?.faceBlendshapes?.[0];

  if (!b) {
    return volume > 0.07 ? "open_mouth" : "static";
  }

  const jawOpen = getBlend(b, "jawOpen");
  const browInnerUp = getBlend(b, "browInnerUp");
  const smile = (getBlend(b, "mouthSmileLeft") + getBlend(b, "mouthSmileRight")) / 2;
  const eyeWide = (
    getBlend(b, "eyeWideLeft") +
    getBlend(b, "eyeWideRight")
  ) / 2;

  if (jawOpen > 0.45 && (browInnerUp > 0.18 || eyeWide > 0.18)) return "surprised";
  if (browInnerUp > 0.34 || eyeWide > 0.30 || smile > 0.35) return "brows";
  if (jawOpen > 0.13 || volume > 0.065) return "open_mouth";

  return "static";
}

function stabilizeEmotion(next) {
  const now = performance.now();

  if (next !== currentEmotion) {
    currentEmotion = next;
    stableSince = now;
    return stableEmotion;
  }

  const delay = next === "open_mouth" ? 35 : 110;
  if (now - stableSince > delay) stableEmotion = next;

  return stableEmotion;
}

function updateHeadFromLandmarks(result) {
  const lm = result?.faceLandmarks?.[0];

  if (!lm || !lm[1]) {
    head.x *= 0.92;
    head.y *= 0.92;
    return;
  }

  const nose = lm[1];
  const power = Number(moveInput.value);

  head.x = (0.5 - nose.x) * power * 1.8;
  head.y = (nose.y - 0.5) * power * 1.15;
}

function render(targetCtx, w, h, bg) {
  targetCtx.imageSmoothingEnabled = false;

  targetCtx.fillStyle = bg;
  targetCtx.fillRect(0, 0, w, h);

  const sprite = sprites[stableEmotion] || sprites.static;
  if (!sprite) return;

  const smoothing = Number(smoothInput.value) / 100;
  smoothHead.x = smoothHead.x * smoothing + head.x * (1 - smoothing);
  smoothHead.y = smoothHead.y * smoothing + head.y * (1 - smoothing);

  const scale = Number(scaleInput.value);
  const sw = Math.round(sprite.width * scale);
  const sh = Math.round(sprite.height * scale);

  const x = Math.round(w / 2 - sw / 2 + smoothHead.x);
  const y = Math.round(h / 2 - sh / 2 + smoothHead.y);

  targetCtx.drawImage(sprite, x, y, sw, sh);
}

async function initFaceLandmarker() {
  setStatus("LOAD MEDIAPIPE");

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: MODEL_URL,
      delegate: "GPU"
    },
    outputFaceBlendshapes: true,
    runningMode: "VIDEO",
    numFaces: 1
  });
}

async function initStreams() {
  setStatus("ASK CAMERA");

  cameraStream = await navigator.mediaDevices.getUserMedia({
    video: {
      width: { ideal: 1280 },
      height: { ideal: 720 },
      facingMode: "user"
    },
    audio: false
  });

  micStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    },
    video: false
  });

  video.srcObject = cameraStream;
  await video.play();

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  audioData = new Uint8Array(analyser.frequencyBinCount);
}

function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime && faceLandmarker) {
    lastVideoTime = video.currentTime;

    const result = faceLandmarker.detectForVideo(video, performance.now());
    const volume = getMicVolume();

    updateHeadFromLandmarks(result);

    const next = chooseSprite(result, volume);
    stabilizeEmotion(next);
  } else {
    head.x *= 0.96;
    head.y *= 0.96;
  }

  render(ctx, canvas.width, canvas.height, "#000000");
  render(recordCtx, recordCanvas.width, recordCanvas.height, EXPORT_GREEN);

  emotionEl.textContent = stableEmotion.toUpperCase();

  requestAnimationFrame(loop);
}

function selectMimeType() {
  const types = [
    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  return types.find(type => MediaRecorder.isTypeSupported(type)) || "";
}

function startRecording() {
  chunks = [];
  download.classList.add("hidden");
  download.removeAttribute("href");

  const canvasStream = recordCanvas.captureStream(30);
  const tracks = [
    ...canvasStream.getVideoTracks(),
    ...micStream.getAudioTracks()
  ];

  const mixed = new MediaStream(tracks);
  recordingMime = selectMimeType();

  const options = recordingMime ? { mimeType: recordingMime } : undefined;
  recorder = new MediaRecorder(mixed, options);

  recorder.ondataavailable = event => {
    if (event.data && event.data.size > 0) chunks.push(event.data);
  };

  recorder.onstop = () => {
    const type = recordingMime || "video/webm";
    const blob = new Blob(chunks, { type });
    const url = URL.createObjectURL(blob);
    const isMp4 = type.includes("mp4");

    download.href = url;
    download.download = `pixel-vtuber-green-${new Date().toISOString().replace(/[:.]/g, "-")}.${isMp4 ? "mp4" : "webm"}`;
    download.classList.remove("hidden");

    btnRecord.disabled = false;
    btnStop.disabled = true;
    setStatus("READY");
  };

  recorder.start(250);

  formatEl.textContent = recordingMime || "DEFAULT";
  btnRecord.disabled = true;
  btnStop.disabled = false;
  setStatus("REC");
}

btnStart.addEventListener("click", async () => {
  try {
    btnStart.disabled = true;

    await loadSprites();
    await initFaceLandmarker();
    await initStreams();

    btnRecord.disabled = false;
    setStatus("CAMERA ON");

    loop();
  } catch (error) {
    console.error(error);
    setStatus("ERROR");
    btnStart.disabled = false;
    alert(error.message);
  }
});

btnRecord.addEventListener("click", startRecording);

btnStop.addEventListener("click", () => {
  if (recorder && recorder.state !== "inactive") recorder.stop();
});

showCameraInput.addEventListener("change", () => {
  video.classList.toggle("visible", showCameraInput.checked);
});

loadSprites().then(() => {
  stableEmotion = "static";
  render(ctx, canvas.width, canvas.height, "#000000");
  render(recordCtx, recordCanvas.width, recordCanvas.height, EXPORT_GREEN);
});
</script>
</body>
</html>
