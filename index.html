<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@danyapez</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:monospace}
.app{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) 360px;background:#000}
.stage{display:grid;place-items:center;min-height:100svh;background:#000}
#preview{width:min(100vw,calc(100svh*16/9));max-width:100%;aspect-ratio:16/9;background:#000;image-rendering:pixelated}
#camera{position:absolute;right:16px;bottom:16px;width:180px;aspect-ratio:16/9;object-fit:cover;transform:scaleX(-1);display:none;border:1px solid #fff;background:#000}
#camera.visible{display:block}
.panel{padding:18px;background:#060606;border-left:1px solid #333;display:flex;flex-direction:column;gap:12px}
button,a{width:100%;border:1px solid #fff;background:#000;color:#fff;padding:12px;text-align:center;text-decoration:none;font:inherit}
button:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:grid;gap:6px;font-size:12px}
input[type=range]{width:100%}
.warn{color:#ffcc00;font-size:12px;line-height:1.5}
.hidden{display:none!important}
@media(max-width:800px){
.app{display:block}
.stage{height:38svh;min-height:0}
.panel{min-height:62svh;border-left:0;border-top:1px solid #333}
}
</style>
</head>
<body>
<main class="app">
<section class="stage">
<canvas id="preview" width="1920" height="1080"></canvas>
<video id="camera" playsinline muted autoplay></video>
</section>

<aside class="panel">
<h2>@danyapez</h2>
<div id="warn" class="warn"></div>

<button id="start">START CAMERA</button>
<button id="rec">REC</button>
<button id="stop" disabled>STOP</button>
<a id="download" class="hidden" download>DOWNLOAD MP4</a>

<div class="grid">
<button data-s="static">STATIC</button>
<button data-s="open_mouth">MOUTH</button>
<button data-s="brows">BROWS</button>
<button data-s="surprised">WOW</button>
</div>

<label>SIZE
<input id="scale" type="range" min="0.7" max="2.6" step="0.05" value="1.55">
</label>

<label>HEAD MOVE
<input id="move" type="range" min="0" max="220" step="1" value="90">
</label>

<label>SMOOTH
<input id="smooth" type="range" min="0" max="96" step="1" value="78">
</label>

<label>
<input id="showCam" type="checkbox"> SHOW CAMERA
</label>
</aside>
</main>

<script type="module">
import{FaceLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

const SPRITE_URLS={
 static:"static.png",
 open_mouth:"open_mouth.png",
 brows:"brows.png",
 surprised:"surprised.png"
};

const MODEL_URL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task";
const GREEN="#00FF00";

const preview=document.querySelector("#preview");
const pctx=preview.getContext("2d",{alpha:false});

const recCanvas=document.createElement("canvas");
const rctx=recCanvas.getContext("2d",{alpha:false});

const video=document.querySelector("#camera");

const el={
 start:document.querySelector("#start"),
 rec:document.querySelector("#rec"),
 stop:document.querySelector("#stop"),
 download:document.querySelector("#download"),
 warn:document.querySelector("#warn"),
 scale:document.querySelector("#scale"),
 move:document.querySelector("#move"),
 smooth:document.querySelector("#smooth"),
 showCam:document.querySelector("#showCam")
};

let sprites={};
let face=null;
let stream=null;
let micStream=null;
let audioCtx=null;
let analyser=null;
let audioData=null;

let recorder=null;
let chunks=[];
let lastVideoTime=-1;

let stable="static";
let current="static";
let since=performance.now();

let cameraReady=false;
let head={x:0,y:0};
let smoothHead={x:0,y:0};

let recordStartedAt=0;
let recordTimer=null;

function warn(t){
 el.warn.textContent=t;
}

function formatTime(ms){
 const total=Math.max(0,Math.floor(ms/1000));
 const m=String(Math.floor(total/60)).padStart(2,"0");
 const s=String(total%60).padStart(2,"0");
 return m+":"+s;
}

function startRecordTimer(){
 recordStartedAt=performance.now();
 if(recordTimer)clearInterval(recordTimer);

 const tick=()=>{
  const t=formatTime(performance.now()-recordStartedAt);
  el.rec.textContent="REC "+t;
 };

 tick();
 recordTimer=setInterval(tick,250);
}

function stopRecordTimer(){
 if(recordTimer)clearInterval(recordTimer);
 recordTimer=null;
 el.rec.textContent="SAVE...";
}

function resizeRec(){
 recCanvas.width=1920;
 recCanvas.height=1080;
}

function mp4Mime(){
 const types=[
  "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
  "video/mp4;codecs=avc1.640028,mp4a.40.2",
  "video/mp4;codecs=h264,aac",
  "video/mp4"
 ];
 return types.find(t=>MediaRecorder.isTypeSupported(t))||"";
}

function loadImage(src){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>resolve(img);
  img.onerror=()=>reject(new Error("PNG не загрузился: "+src));
  img.src=src+"?v=1";
 });
}

async function loadSprites(){
 const out={};

 for(const [key,url] of Object.entries(SPRITE_URLS)){
  out[key]=await loadImage(url);
 }

 sprites=out;
}

function getBlend(bs,name){
 const item=bs?.categories?.find(c=>c.categoryName===name);
 return item?item.score:0;
}

function getVolume(){
 if(!analyser||!audioData)return 0;

 analyser.getByteTimeDomainData(audioData);

 let sum=0;

 for(const value of audioData){
  const n=(value-128)/128;
  sum+=n*n;
 }

 return Math.sqrt(sum/audioData.length);
}

function chooseSprite(result,volume){
 const b=result?.faceBlendshapes?.[0];

 if(!b){
  return volume>0.07?"open_mouth":stable;
 }

 const jaw=getBlend(b,"jawOpen");
 const brow=getBlend(b,"browInnerUp");
 const smile=(getBlend(b,"mouthSmileLeft")+getBlend(b,"mouthSmileRight"))/2;
 const wide=(getBlend(b,"eyeWideLeft")+getBlend(b,"eyeWideRight"))/2;

 if(jaw>0.45&&(brow>0.18||wide>0.18))return"surprised";
 if(brow>0.34||wide>0.30||smile>0.35)return"brows";
 if(jaw>0.13||volume>0.065)return"open_mouth";

 return"static";
}

function stabilize(next){
 const now=performance.now();

 if(next!==current){
  current=next;
  since=now;
  return stable;
 }

 const delay=next==="open_mouth"?35:110;

 if(now-since>delay){
  stable=next;
 }

 return stable;
}

function updateHead(result){
 const lm=result?.faceLandmarks?.[0];

 if(!lm||!lm[1]){
  head.x*=0.92;
  head.y*=0.92;
  return;
 }

 const nose=lm[1];
 const power=Number(el.move.value);

 head.x=(0.5-nose.x)*power*1.8;
 head.y=(nose.y-0.5)*power*1.15;
}

function render(ctx,w,h,bg){
 ctx.imageSmoothingEnabled=false;
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,w,h);

 const sprite=sprites[stable]||sprites.static;
 if(!sprite)return;

 const smooth=Number(el.smooth.value)/100;

 smoothHead.x=smoothHead.x*smooth+head.x*(1-smooth);
 smoothHead.y=smoothHead.y*smooth+head.y*(1-smooth);

 const f=h/1080;
 const scale=Number(el.scale.value)*f;

 const sw=Math.round(sprite.naturalWidth*scale);
 const sh=Math.round(sprite.naturalHeight*scale);

 const x=Math.round(w/2-sw/2+smoothHead.x*f);
 const y=Math.round(h/2-sh/2+smoothHead.y*f);

 ctx.drawImage(sprite,x,y,sw,sh);
}

async function initFace(){
 if(face)return;

 const vision=await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
 );

 face=await FaceLandmarker.createFromOptions(vision,{
  baseOptions:{
   modelAssetPath:MODEL_URL,
   delegate:"GPU"
  },
  outputFaceBlendshapes:true,
  runningMode:"VIDEO",
  numFaces:1
 });
}

async function initCamera(){
 if(!navigator.mediaDevices?.getUserMedia){
  throw new Error("CAMERA API NOT AVAILABLE");
 }

 if(!window.isSecureContext){
  throw new Error("OPEN THROUGH HTTPS OR LOCALHOST");
 }

 stream=await navigator.mediaDevices.getUserMedia({
  video:{
   width:{ideal:1280},
   height:{ideal:720},
   facingMode:"user"
  },
  audio:{
   echoCancellation:false,
   noiseSuppression:false,
   autoGainControl:false,
   sampleRate:{ideal:44100},
   channelCount:{ideal:1}
  }
 });

 video.srcObject=stream;
 await video.play();

 micStream=new MediaStream(stream.getAudioTracks());

 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 await audioCtx.resume();

 if(micStream.getAudioTracks().length){
  const source=audioCtx.createMediaStreamSource(micStream);
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=512;
  source.connect(analyser);
  audioData=new Uint8Array(analyser.frequencyBinCount);
 }

 cameraReady=true;
}

function loop(){
 if(
  cameraReady&&
  video.readyState>=2&&
  video.currentTime!==lastVideoTime&&
  face
 ){
  lastVideoTime=video.currentTime;

  const result=face.detectForVideo(video,performance.now());
  const volume=getVolume();

  updateHead(result);
  stabilize(chooseSprite(result,volume));
 }else{
  head.x*=0.96;
  head.y*=0.96;
 }

 render(pctx,preview.width,preview.height,"#000000");
 render(rctx,recCanvas.width,recCanvas.height,GREEN);

 requestAnimationFrame(loop);
}

function startRec(){
 resizeRec();

 const mime=mp4Mime();

 if(!mime){
  warn("MP4 RECORDING IS NOT SUPPORTED IN THIS BROWSER");
  return;
 }

 chunks=[];
 el.download.classList.add("hidden");

 const videoStream=recCanvas.captureStream(30);
 const audioTracks=micStream?micStream.getAudioTracks():[];

 if(!audioTracks.length){
  warn("MICROPHONE TRACK NOT FOUND. VIDEO WILL BE RECORDED WITHOUT AUDIO.");
 }

 const mixedStream=new MediaStream([
  ...videoStream.getVideoTracks(),
  ...audioTracks
 ]);

 recorder=new MediaRecorder(mixedStream,{
  mimeType:mime,
  videoBitsPerSecond:12000000,
  audioBitsPerSecond:128000
 });

 recorder.ondataavailable=e=>{
  if(e.data&&e.data.size){
   chunks.push(e.data);
  }
 };

 recorder.onstop=()=>{
  stopRecordTimer();

  const blob=new Blob(chunks,{type:mime});
  const stamp=new Date().toISOString().replace(/[:.]/g,"-");

  el.download.href=URL.createObjectURL(blob);
  el.download.download=`danyapez_avatar_1920x1080_${stamp}.mp4`;
  el.download.classList.remove("hidden");

  el.rec.disabled=false;
  el.rec.textContent="REC";
  el.stop.disabled=true;

  setTimeout(()=>el.download.click(),120);
 };

 recorder.start(1000);

 startRecordTimer();

 el.rec.disabled=true;
 el.stop.disabled=false;
}

el.start.onclick=async()=>{
 try{
  el.start.disabled=true;
  warn("");

  await loadSprites();
  await initFace();
  await initCamera();
 }catch(e){
  console.error(e);
  el.start.disabled=false;
  cameraReady=false;
  warn(String(e.message||e)+". Open in Safari/Chrome directly.");
 }
};

el.rec.onclick=()=>{
 try{
  startRec();
 }catch(e){
  console.error(e);
  warn("REC ERROR: "+e.message);
 }
};

el.stop.onclick=()=>{
 if(recorder&&recorder.state!=="inactive"){
  recorder.stop();
 }
};

el.showCam.onchange=()=>{
 video.classList.toggle("visible",el.showCam.checked);
};

document.querySelectorAll("[data-s]").forEach(button=>{
 button.onclick=()=>{
  stable=button.dataset.s;
  current=stable;
  head.x=0;
  head.y=0;
 };
});

await loadSprites();

resizeRec();

stable="static";

render(pctx,preview.width,preview.height,"#000000");
render(rctx,recCanvas.width,recCanvas.height,GREEN);

loop();
</script>
</body>
</html>
