<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@danyapez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Press Start 2P",monospace;font-size:11px}
.app{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) 400px;background:#000}
.stage{position:relative;display:grid;place-items:center;min-height:100svh;background:#000;overflow:hidden}
#preview{width:min(100vw,calc(100svh * 16 / 9));max-width:100%;aspect-ratio:16/9;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
#camera{position:absolute;right:18px;bottom:18px;width:220px;aspect-ratio:16/9;object-fit:cover;border:1px solid rgba(255,255,255,.25);transform:scaleX(-1);display:none;background:#000}
#camera.visible{display:block}
.panel{padding:22px;background:#050505;border-left:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 6px;font-size:15px;line-height:1.45;letter-spacing:.5px}
p{margin:0;color:#8f8f8f;font-size:8px;line-height:1.8}
.buttons,.manual{display:grid;gap:9px}
.downloads{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.downloads a[aria-disabled="true"]{opacity:.3;pointer-events:none;cursor:not-allowed}
.downloads a[aria-disabled="false"]{border-color:#7741F6;color:#fff}
.manual{grid-template-columns:1fr 1fr}
button,a,select{width:100%;border:1px solid #fff;border-radius:0;padding:13px 10px;background:transparent;color:#fff;font-family:"Press Start 2P",monospace;font-size:8px;line-height:1.45;text-align:center;text-decoration:none;cursor:pointer}
select{text-align:left;appearance:none;-webkit-appearance:none}
button:hover:not(:disabled),button:active:not(:disabled),a:hover,select:hover{background:#7741F6;color:#fff;border-color:#7741F6}
button:disabled{opacity:.35;cursor:not-allowed}
.hidden{display:none!important}
label{display:grid;gap:8px;color:#fff;font-size:9px;line-height:1.6}
label .setting-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
label output{color:#7741F6;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#fff}
.check{grid-template-columns:18px 1fr;align-items:start}
input[type=checkbox]{margin:0;width:13px;height:13px;accent-color:#fff}
.status{margin-left:auto;max-width:62%;padding:0;border:0;font-size:7px;line-height:1.55;text-align:right;overflow-wrap:anywhere}
.status span{color:#7741F6}
.warn{display:none;border:1px solid #ffcc00;color:#ffcc00;padding:12px;font-size:8px;line-height:1.7}
.warn.visible{display:block}

.brand{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px}
.brand h1{margin:0}

.voice-box,.teleprompter-reader{border:1px solid rgba(255,255,255,.25);padding:12px;display:grid;gap:10px}
.teleprompter-editor{display:grid;gap:10px}
.block-title{color:#7741F6;font-size:8px;line-height:1.6}
#voiceFxToggle.active{background:#7741F6;border-color:#7741F6}
.small-note{color:#777;font:11px/1.45 Arial,sans-serif}
.teleprompter-editor textarea{width:100%;min-height:120px;resize:vertical;border:1px solid rgba(255,255,255,.35);background:#000;color:#fff;padding:12px;font:10px/1.9 "Press Start 2P",monospace}
.teleprompter-estimate{display:flex;justify-content:space-between;gap:10px;color:#8f8f8f;font:12px/1.4 Arial,sans-serif;font-variant-numeric:tabular-nums}
.teleprompter-estimate span:first-child{color:#7741F6;font-weight:700}
.teleprompter-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rec-grid{display:grid;grid-template-columns:1fr;gap:9px}
#aiRec.active{background:#7741F6;border-color:#7741F6}
.teleprompter-reader{position:sticky;top:8px;z-index:5;height:245px;overflow:hidden;background:#000;border-color:#7741F6;box-shadow:0 8px 30px rgba(0,0,0,.85)}
.teleprompter-reader.speaking{border-color:#24c86a}
.teleprompter-reader-head{display:flex;justify-content:space-between;gap:10px;color:#7741F6;font-size:7px;line-height:1.5}
.teleprompter-reader.speaking .teleprompter-reader-head{color:#24c86a}
.teleprompter-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;cursor:grab;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.teleprompter-scroll::-webkit-scrollbar{display:none}
.teleprompter-text{padding:72px 14px 190px;white-space:pre-wrap;font:16px/1.9 "Press Start 2P",monospace;text-align:center}
.teleprompter-text .tp-word{opacity:.34;transition:opacity .16s,color .16s,background .16s}
.teleprompter-text .tp-word.spoken{opacity:.58;color:#aaa}
.teleprompter-text .tp-word.current{opacity:1;color:#fff;background:#7741F6;box-shadow:0 0 0 3px #7741F6}

@media(max-width:900px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .stage{min-height:0;height:38svh}
 .panel{border-left:0;border-top:1px solid rgba(255,255,255,.25);min-height:62svh;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
 #camera{width:130px;right:10px;bottom:10px}
 h1{font-size:12px} button,a,select{font-size:7px;padding:12px 9px}
 .teleprompter-editor textarea{font:16px/1.55 Arial,sans-serif}
 .teleprompter-reader{top:4px;height:225px}
 .teleprompter-text{font-size:14px}
}
@media(max-width:520px){.teleprompter-actions,.downloads{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<section class="stage">
<canvas id="preview" width="1920" height="1080"></canvas>
<video id="camera" playsinline muted autoplay></video>
</section>

<aside class="panel">
<div>
<div class="brand">
<h1>@danyapez</h1>
<div class="status">СТАТУС: <span id="status">WAIT</span></div>
</div>
</div>

<div id="warn" class="warn"></div>

<div class="teleprompter-editor" id="teleprompterEditor">
<div class="block-title">ТЕЛЕСУФЛЁР</div>
<textarea id="teleprompterInput" placeholder="Вставьте сюда текст и нажмите ЗАПИСЬ."></textarea>
<div class="teleprompter-estimate" aria-live="polite"><span id="teleprompterEstimate">ПРИМЕРНО: 0 СЕК</span><span id="teleprompterWordCount">0 СЛОВ</span></div>
<button id="teleprompterDelete" type="button">УДАЛИТЬ ТЕКСТ</button>
<button id="teleprompterPaste" class="hidden" type="button">ВСТАВИТЬ ТЕКСТ</button>
</div>

<div class="teleprompter-reader hidden" id="teleprompterReader">
<div class="teleprompter-reader-head"><span>ТЕЛЕСУФЛЁР</span><span id="teleprompterState">ЖДУ ГОЛОС</span></div>
<div class="teleprompter-scroll" id="teleprompterScroll"><div class="teleprompter-text" id="teleprompterText"></div></div>
<button id="teleprompterClose" type="button">ЗАКРЫТЬ</button>
</div>

<div class="buttons">
<button id="aiRec">ЗАПИСЬ</button>
</div>

<div class="downloads">
<a id="downloadZip" aria-disabled="true" download>СКАЧАТЬ ПЕРСОНАЖА</a>
<a id="downloadSubtitles" aria-disabled="true" download>СКАЧАТЬ СУБТИТРЫ</a>
</div>

<div class="hidden">
  <button id="start" type="button"></button>
  <button id="rec" type="button"></button>
  <button id="stop" type="button" disabled></button>
  <button id="voiceFxToggle" type="button"></button>
  <input id="voiceDepth" type="hidden" value="0.25">
  <input id="scale" type="hidden" value="1.55">
  <output id="scaleValue">1.55×</output>
  <input id="move" type="hidden" value="220">
  <output id="moveValue">220</output>
  <input id="smooth" type="hidden" value="30">
  <output id="smoothValue">30%</output>
  <input id="showCam" type="checkbox">
  <span id="sprite">STATIC</span>
  <span id="exportInfo">1920×1080</span>
  <span id="format">MP4</span>
</div>

</aside>
</main>

async function keepScreenAwake(){

 if(screenWakeLock||!navigator.wakeLock?.request||document.visibilityState!=="visible")return;
 try{
  const lock=await navigator.wakeLock.request("screen");
  screenWakeLock=lock;
  lock.addEventListener("release",()=>{if(screenWakeLock===lock)screenWakeLock=null},{once:true});
 }catch(error){console.warn("SCREEN WAKE LOCK",error)}
}

function releaseScreenAwake(){
 screenWakeLockWanted=false;

 if(lock)lock.release().catch(error=>console.warn("SCREEN WAKE RELEASE",error));
}

function getBlend(bs,n){const i=bs?.categories?.find(c=>c.categoryName===n);return i?i.score:0}

function volume(){
 if(!analyser||!audioData)return 0;
 analyser.getByteTimeDomainData(audioData);
 let s=0;
 for(const v of audioData){const n=(v-128)/128;s+=n*n}
 return Math.sqrt(s/audioData.length);
}

function choose(result,vol){
 const b=result?.faceBlendshapes?.[0];
 if(!b)return vol>.07?"open_mouth":stable;

 const jaw=getBlend(b,"jawOpen");
 const brow=getBlend(b,"browInnerUp");
 const smile=(getBlend(b,"mouthSmileLeft")+getBlend(b,"mouthSmileRight"))/2;
 const wide=(getBlend(b,"eyeWideLeft")+getBlend(b,"eyeWideRight"))/2;

 if(jaw>.45&&(brow>.18||wide>.18))return"surprised";
 if(brow>.34||wide>.30||smile>.35)return"brows";
 if(jaw>.13||vol>.065)return"open_mouth";
 return"static";
}

function stabilize(next){
 const now=performance.now();
 if(next!==current){current=next;since=now;return stable}
 const delay=next==="open_mouth"?35:110;
 if(now-since>delay)stable=next;
 return stable;
}

function updateHead(result){
 const lm=result?.faceLandmarks?.[0];
 if(!lm||!lm[1]){head.x*=.92;head.y*=.92;return}
 const nose=lm[1], power=Number(el.move.value);
 head.x=(.5-nose.x)*power*1.8;
 head.y=(nose.y-.5)*power*1.15;
}

// Пиксельный аватар двигается короткими шагами, а не «плывёт» каждый кадр.
// Регулятор плавности по-прежнему работает: 0% — резко, 96% — очень мягко.
function advanceHead(now){
 if(now<nextHeadStep)return;
 // AI обновляется каждый кадр для непрерывной траектории; камера остаётся пиксельной.
 nextHeadStep=now+(aiMode?16:45);
 const retention=Math.min(.96,Math.max(0,Number(el.smooth.value)/100));
 const step=4;
 const targetX=Math.round(head.x/step)*step;
 const targetY=Math.round(head.y/step)*step;
 smoothHead.x=smoothHead.x*retention+targetX*(1-retention);
 smoothHead.y=smoothHead.y*retention+targetY*(1-retention);
}

function render(ctx,w,h,bg){
 ctx.imageSmoothingEnabled=false;
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,w,h);

 const sp=sprites[stable]||sprites.static;
 if(!sp)return;

 const f=h/1080;
 const sc=Number(el.scale.value)*f;
 const sw=Math.round(sp.naturalWidth*sc), sh=Math.round(sp.naturalHeight*sc);
 const x=Math.round(w/2-sw/2+smoothHead.x*f);
 const y=Math.round(h/2-sh/2+smoothHead.y*f);

 ctx.drawImage(sp,x,y,sw,sh);
}

function layoutSubtitleLines(ctx,words,maxWidth){
 const lines=[];
 const spaceWidth=ctx.measureText(" ").width;
 let line={items:[],width:0};
 for(let index=0;index<words.length;index++){
  const text=words[index],wordWidth=ctx.measureText(text).width;
  const candidateWidth=line.width+(line.items.length?spaceWidth:0)+wordWidth;
  if(line.items.length&&candidateWidth>maxWidth){
   lines.push(line);
   line={items:[],width:0};
  }
  if(line.items.length)line.width+=spaceWidth;
  line.items.push({index,text,width:wordWidth});
  line.width+=wordWidth;
 }
 if(line.items.length)lines.push(line);
 return {lines,spaceWidth};
}

function renderSubtitles(ctx,w,h){
 ctx.imageSmoothingEnabled=false;
 ctx.fillStyle=SUBTITLE_BACKGROUND;
 ctx.fillRect(0,0,w,h);
 if(!aiMode||!audioCtx||!aiTeleprompterWords.length||aiTeleprompterWordIndex<0)return;
 const elapsed=subtitleReplayActive
  ?(performance.now()-subtitleReplayStartAt)/1000
  :audioCtx.currentTime-aiTeleprompterStartAt;
 if(elapsed<0||elapsed>aiTeleprompterDuration+.12)return;

 const scale=w/1080;
 const fontSize=Math.round(38*scale),lineHeight=Math.round(92*scale);
 const plaquePadX=Math.round(14*scale),plaquePadY=Math.round(12*scale);
 ctx.font=`${fontSize}px "Press Start 2P",monospace`;
 ctx.textAlign="left";
 ctx.textBaseline="middle";
 const words=aiTeleprompterWords.map(word=>word.textContent);
 const layout=layoutSubtitleLines(ctx,words,w-Math.round(150*scale));
 const currentLine=Math.max(0,layout.lines.findIndex(line=>line.items.some(item=>item.index===aiTeleprompterWordIndex)));
 const pageStart=Math.floor(currentLine/2)*2;
 const pageLines=layout.lines.slice(pageStart,pageStart+2);
 if(!pageLines.length)return;
 const firstLineY=pageLines.length===1?h/2:h/2-lineHeight/2;

 pageLines.forEach((line,lineIndex)=>{
  const y=firstLineY+lineIndex*lineHeight;
  let x=(w-line.width)/2;
  line.items.forEach((item,itemIndex)=>{
   const isCurrent=item.index===aiTeleprompterWordIndex;
   if(isCurrent){
    ctx.fillStyle="#7741F6";
    ctx.fillRect(
     Math.round(x-plaquePadX),
     Math.round(y-fontSize*.72-plaquePadY),
     Math.ceil(item.width+plaquePadX*2),
     Math.ceil(fontSize*1.44+plaquePadY*2)
    );
   }
   ctx.fillStyle="#FFFFFF";
   ctx.fillText(item.text,x,y);
   x+=item.width+(itemIndex<line.items.length-1?layout.spaceWidth:0);
  });
 });
}

 const options=delegate=>({

  outputFaceBlendshapes:true,

 });
 try{
  face=await FaceLandmarker.createFromOptions(vision,options("GPU"));

}

function makeDriveCurve(amount=1.7){
 const n=32768,curve=new Float32Array(n),norm=Math.tanh(amount)||1;
 for(let i=0;i<n;i++){const x=i*2/n-1;curve[i]=Math.tanh(x*amount)/norm}
 return curve;
}

function setVoiceFxEnabled(enabled){

async function edgeTTSFetch(url,options={},attempts=3,timeoutMs=120000){
 let lastError;
 for(let attempt=0;attempt<attempts;attempt++){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
   const response=await fetch(url,{...options,signal:controller.signal});
   clearTimeout(timer);
   if(response.ok)return response;
   lastError=new Error("AI VOICE SERVER "+response.status);
  }catch(error){clearTimeout(timer);lastError=error}
  if(attempt<attempts-1)await edgeTTSWait(1800+attempt*2200);
 }
 throw lastError||new Error("AI VOICE NETWORK ERROR");
}

async function synthesizeText(text){
 const submission=await edgeTTSFetch(EDGE_TTS_API,{
  method:"POST",headers:{"Content-Type":"application/json"},
  // The Friday reference used Florian at +20% rate and about +21 Hz pitch.
  // Let Edge TTS create that pitch natively so the voice stays clean and human.
  body:JSON.stringify({data:[text,EDGE_TTS_VOICE,20,21]})
 },4,35000);
 const submitted=await submission.json();
 if(!submitted.event_id)throw new Error("AI VOICE START ERROR");

 const eventResponse=await edgeTTSFetch(`${EDGE_TTS_API}/${submitted.event_id}`,{headers:{Accept:"text/event-stream"}},3,120000);
 const eventText=await eventResponse.text();
 if(/event:\s*error/i.test(eventText))throw new Error("AI VOICE SERVER ERROR");
 const complete=eventText.match(/event:\s*complete\s*[\r\n]+data:\s*(.+)/i);
 if(!complete)throw new Error("AI VOICE EMPTY RESPONSE");
 const result=JSON.parse(complete[1]);
 const audioUrl=result?.[0]?.url;
 if(!audioUrl)throw new Error("AI VOICE AUDIO NOT FOUND");

 const audioResponse=await edgeTTSFetch(audioUrl,{},3,45000);
 const mp3=await audioResponse.arrayBuffer();
 const decoded=await audioCtx.decodeAudioData(mp3.slice(0));
 const samples=new Float32Array(decoded.length);
 if(decoded.numberOfChannels===1)samples.set(decoded.getChannelData(0));
 else for(let channel=0;channel<decoded.numberOfChannels;channel++){
  const data=decoded.getChannelData(channel);
  for(let index=0;index<data.length;index++)samples[index]+=data[index]/decoded.numberOfChannels;
 }
 return {samples,sampleRate:decoded.sampleRate};
}

function buildAIEnvelope(samples,sampleRate){
 const frameSize=Math.max(128,Math.round(sampleRate*aiEnvelopeStep));
 const frameCount=Math.max(1,Math.ceil(samples.length/frameSize));
 const envelope=new Float32Array(frameCount);
 let peak=.00001;
 for(let frame=0;frame<frameCount;frame++){
  const start=frame*frameSize,end=Math.min(samples.length,start+frameSize);
  let sum=0;
  for(let index=start;index<end;index++)sum+=samples[index]*samples[index];
  const rms=Math.sqrt(sum/Math.max(1,end-start));
  envelope[frame]=rms;if(rms>peak)peak=rms;
 }
 for(let frame=0;frame<frameCount;frame++)envelope[frame]=Math.sqrt(Math.min(1,envelope[frame]/peak));
 return envelope;
}

function estimateSpeechDuration(text){
 const clean=text.trim();
 if(!clean)return {seconds:0,words:0};
 const words=clean.match(/[\p{L}\p{N}]+(?:[-'][\p{L}\p{N}]+)*/gu)||[];
 const spokenCharacters=(clean.match(/[\p{L}\p{N}]/gu)||[]).length;
 const sentences=(clean.match(/[.!?…]+/g)||[]).length;
 const shortPauses=(clean.match(/[,;:—-]+/g)||[]).length;
 const lineBreaks=(clean.match(/\n+/g)||[]).length;
 // Голос генерируется со скоростью +20%. Берём одновременно число слов и
 // символов, чтобы короткие и длинные русские слова считались одинаково честно.
 const speech=Math.max(words.length/2.8,spokenCharacters/17.5);
 const seconds=Math.max(1,Math.ceil(speech+sentences*.22+shortPauses*.09+lineBreaks*.08+.2));
 return {seconds,words:words.length};
}

function formatSpeechDuration(totalSeconds){
 const seconds=Math.max(0,Math.round(totalSeconds));
 if(seconds<60)return `${seconds} СЕК`;
 const minutes=Math.floor(seconds/60),rest=seconds%60;
 return rest?`${minutes} МИН ${rest} СЕК`:`${minutes} МИН`;
}

 el.teleprompterEstimate.textContent=`${exactDuration===null?"ПРИМЕРНО":"ТОЧНО"}: ${formatSpeechDuration(duration)}`;
 el.teleprompterWordCount.textContent=`${estimate.words} СЛОВ`;

function prepareAITeleprompter(text){
 el.teleprompterText.textContent="";
 aiTeleprompterWords=[];aiTeleprompterWeights=[];aiTeleprompterTotalWeight=0;aiTeleprompterWordIndex=-1;aiSubtitleCues=[];aiSubtitleText="";
 const parts=text.match(/\S+|\s+/g)||[];
 for(const part of parts){
  if(/^\s+$/.test(part)){el.teleprompterText.append(document.createTextNode(part));continue}
  const word=document.createElement("span");word.className="tp-word";word.textContent=part;el.teleprompterText.append(word);aiTeleprompterWords.push(word);
  const punctuation=(part.match(/[.!?…]/g)||[]).length*5+(part.match(/[,;:—-]/g)||[]).length*2;
  aiTeleprompterTotalWeight+=Math.max(2,part.replace(/[^\p{L}\p{N}]/gu,"").length)+punctuation;
  aiTeleprompterWeights.push(aiTeleprompterTotalWeight);
 }
 let cueStart=0,cueWords=[],cueLength=0;
 for(let index=0;index<aiTeleprompterWords.length;index++){
  const value=aiTeleprompterWords[index].textContent;
  cueWords.push(value);cueLength+=value.length+(cueWords.length>1?1:0);
  const sentenceEnd=/[.!?…]["')\]»]*$/.test(value);
  if(sentenceEnd||cueWords.length>=6||cueLength>=36||index===aiTeleprompterWords.length-1){
   aiSubtitleCues.push({start:cueStart,end:index,text:cueWords.join(" ")});
   cueStart=index+1;cueWords=[];cueLength=0;
  }
 }
}

function updateAITeleprompterProgress(progress){
 if(!aiTeleprompterWords.length)return;
 const target=Math.max(0,Math.min(aiTeleprompterTotalWeight,progress*aiTeleprompterTotalWeight));
 let low=0,high=aiTeleprompterWeights.length-1;
 while(low<high){const middle=(low+high)>>1;if(aiTeleprompterWeights[middle]<target)low=middle+1;else high=middle}
 const nextIndex=low;
 if(nextIndex!==aiTeleprompterWordIndex){
  for(let i=0;i<aiTeleprompterWords.length;i++)aiTeleprompterWords[i].className="tp-word"+(i<nextIndex?" spoken":i===nextIndex?" current":"");
  aiTeleprompterWordIndex=nextIndex;
  const cue=aiSubtitleCues.find(item=>nextIndex>=item.start&&nextIndex<=item.end);
  aiSubtitleText=cue?.text||aiTeleprompterWords[nextIndex]?.textContent||"";
 }
 const word=aiTeleprompterWords[nextIndex];
 const wanted=word.offsetTop-el.teleprompterScroll.clientHeight*.42+word.offsetHeight*.5;
 const maxScroll=Math.max(0,el.teleprompterScroll.scrollHeight-el.teleprompterScroll.clientHeight);
 el.teleprompterScroll.scrollTop+=(Math.max(0,Math.min(maxScroll,wanted))-el.teleprompterScroll.scrollTop)*.18;
}

let teleprompterNoiseFloor=.006;
function updateTeleprompter(vol,now){
 if(!teleprompterActive){teleprompterLastFrame=now;return}
 const dt=Math.min(80,Math.max(0,now-teleprompterLastFrame));teleprompterLastFrame=now;
 if(aiMode&&aiTeleprompterDuration>0&&audioCtx){
  const elapsed=audioCtx.currentTime-aiTeleprompterStartAt;
  const progress=Math.max(0,Math.min(1,elapsed/aiTeleprompterDuration));
  const speaking=elapsed>=0&&progress<1;
  const elapsedSeconds=Math.max(0,Math.min(Math.ceil(aiTeleprompterDuration),Math.floor(elapsed)));
  const totalSeconds=Math.max(1,Math.ceil(aiTeleprompterDuration));
  const percent=Math.round(progress*100);
  el.teleprompterReader.classList.toggle("speaking",speaking);
  el.teleprompterState.textContent=elapsed<0
   ?`AI • СТАРТ • 0/${totalSeconds} СЕК`
   :progress>=1
    ?`КОНЕЦ • ${totalSeconds}/${totalSeconds} СЕК`
    :`AI • ${percent}% • ${elapsedSeconds}/${totalSeconds} СЕК`;
  updateAITeleprompterProgress(progress);
  return;
 }
 if(vol<.035)teleprompterNoiseFloor=teleprompterNoiseFloor*.985+vol*.015;
 const gate=Math.max(.014,teleprompterNoiseFloor*2.25);
 if(vol>gate)teleprompterSpeakingUntil=now+420;
 const speaking=now<teleprompterSpeakingUntil;
 el.teleprompterReader.classList.toggle("speaking",speaking);
 el.teleprompterState.textContent=speaking?"СЛУШАЮ • AUTO":"ПАУЗА";
 if(speaking&&now>teleprompterManualUntil){
  const speed=38;
  el.teleprompterScroll.scrollTop+=speed*dt/1000;
  if(el.teleprompterScroll.scrollTop+el.teleprompterScroll.clientHeight>=el.teleprompterScroll.scrollHeight-3)el.teleprompterState.textContent="КОНЕЦ";
 }
}

function startWavRecord(){
 wavBuffers=[];
 if(!audioCtx||!micStream||!micStream.getAudioTracks().length)return;

 wavSampleRate=audioCtx.sampleRate;
 wavSource=audioCtx.createMediaStreamSource(micStream);
 wavProcessor=audioCtx.createScriptProcessor(4096,1,1);
 wavSilentGain=audioCtx.createGain();
 wavSilentGain.gain.value=0;

 wavProcessor.onaudioprocess=(event)=>{
  const input=event.inputBuffer.getChannelData(0);
  wavBuffers.push(new Float32Array(input));
  event.outputBuffer.getChannelData(0).fill(0);
 };

 wavSource.connect(wavProcessor);
 wavProcessor.connect(wavSilentGain);
 wavSilentGain.connect(audioCtx.destination);
}

function stopWavRecord(){
 if(wavProcessor){wavProcessor.disconnect();wavProcessor.onaudioprocess=null;wavProcessor=null;}
 if(wavSource){wavSource.disconnect();wavSource=null;}
 if(wavSilentGain){wavSilentGain.disconnect();wavSilentGain=null;}
 return encodeWav(wavBuffers,wavSampleRate);
}

function encodeWav(buffers,sampleRate){
 let length=0;
 for(const b of buffers)length+=b.length;

 const samples=new Float32Array(length);
 let offset=0;
 for(const b of buffers){samples.set(b,offset);offset+=b.length;}

 const wavBuffer=new ArrayBuffer(44+samples.length*2);
 const view=new DataView(wavBuffer);

 function writeString(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}

 writeString(0,"RIFF");
 view.setUint32(4,36+samples.length*2,true);
 writeString(8,"WAVE");
 writeString(12,"fmt ");
 view.setUint32(16,16,true);
 view.setUint16(20,1,true);
 view.setUint16(22,1,true);
 view.setUint32(24,sampleRate,true);
 view.setUint32(28,sampleRate*2,true);
 view.setUint16(32,2,true);
 view.setUint16(34,16,true);
 writeString(36,"data");
 view.setUint32(40,samples.length*2,true);

 let p=44;
 for(let i=0;i<samples.length;i++,p+=2){
  const sample=Math.max(-1,Math.min(1,samples[i]));
  view.setInt16(p,sample<0?sample*0x8000:sample*0x7fff,true);
 }

 return new Blob([view],{type:"audio/wav"});
}

 el.sprite.textContent=stable.toUpperCase();

async function makeCapCutCompatible(rawBlob,progressKey="file",videoBitrate=12000000,requireAudio=true,progressStart=0){
 let mediaTools;
 try{
  mediaTools=await import("https://cdn.jsdelivr.net/npm/mediabunny@1.51.0/+esm");
 }catch(primaryCdnError){
  console.warn("Primary CapCut encoder CDN unavailable",primaryCdnError);
  mediaTools=await import("https://esm.sh/mediabunny@1.51.0");
 }
 const {
  Input,Output,BlobSource,BufferTarget,ALL_FORMATS,Mp4OutputFormat,Conversion
 }=mediaTools;

 const input=new Input({source:new BlobSource(rawBlob),formats:ALL_FORMATS});
 const recordedDuration=await input.computeDuration();
 const [inputVideoTrack,inputAudioTrack]=await Promise.all([
  input.getPrimaryVideoTrack(),input.getPrimaryAudioTrack()
 ]);
 if(!inputVideoTrack)throw new Error("RECORDED VIDEO TRACK IS MISSING");
 if(requireAudio&&!inputAudioTrack)throw new Error("RECORDED AI AUDIO TRACK IS MISSING");
 const target=new BufferTarget();
 const output=new Output({format:new Mp4OutputFormat(),target});
 const conversionOptions={input,output,tracks:"primary",tags:{}};
 // На телефоне не декодируем и не кодируем 1080p/4K заново: это и вызывало
 // аварийный перезапуск вкладки. Контейнер пересобирается без тяжёлого видеотранскода.
 conversionOptions.video=SAFE_EXPORT_MODE
  ?{}
  :{
    codec:"avc",frameRate:30,bitrate:videoBitrate,keyFrameInterval:2,
    forceTranscode:true,hardwareAcceleration:"prefer-hardware"
   };
 if(inputAudioTrack)conversionOptions.audio={
   codec:"aac",sampleRate:AUDIO_SAMPLE_RATE,numberOfChannels:1,
   bitrate:192000,forceTranscode:true
 };
 const conversion=await Conversion.init(conversionOptions);
 if(!conversion.isValid)throw new Error("CAPCUT ENCODER IS NOT SUPPORTED");
 if(!conversion.utilizedTracks.includes(inputVideoTrack))throw new Error("CAPCUT VIDEO TRACK WAS DISCARDED");
 if(inputAudioTrack&&!conversion.utilizedTracks.includes(inputAudioTrack))throw new Error("CAPCUT AUDIO TRACK WAS DISCARDED");
 conversion.onProgress=progress=>setExportProgress(progressKey,progressStart+(1-progressStart)*progress);
 await conversion.execute();
 if(!target.buffer)throw new Error("CAPCUT MP4 IS EMPTY");
 return new Blob([target.buffer],{type:"video/mp4"});
}

function resetDownloadLink(link){
 const cleanupTimer=downloadCleanupTimers.get(link);
 if(cleanupTimer){clearTimeout(cleanupTimer);downloadCleanupTimers.delete(link)}
 const oldUrl=link.getAttribute("href");
 if(oldUrl?.startsWith("blob:"))URL.revokeObjectURL(oldUrl);
 link.removeAttribute("href");
 link.setAttribute("aria-disabled","true");
}

function setDownloadLink(link,blob,filename){
 resetDownloadLink(link);
 link.href=URL.createObjectURL(blob);
 link.download=filename;
 link.setAttribute("aria-disabled","false");
}

function releaseDownloadedFileLater(link){
 const url=link.getAttribute("href");
 if(!url?.startsWith("blob:"))return;
 const previousTimer=downloadCleanupTimers.get(link);
 if(previousTimer)clearTimeout(previousTimer);
 // Загрузке даётся время забрать Blob, затем его большая копия удаляется из RAM.
 const timer=setTimeout(()=>{
  downloadCleanupTimers.delete(link);
  if(link.getAttribute("href")!==url)return;
  URL.revokeObjectURL(url);
  link.removeAttribute("href");
  link.setAttribute("aria-disabled","true");
  scheduleMemoryCleanup();
 },90000);
 downloadCleanupTimers.set(link,timer);
}

function startRec(audioTracksOverride=null,tag="AGENT_Z"){

  warn("MP4 RECORDING IS NOT SUPPORTED IN THIS BROWSER. OPEN IN CHROME/EDGE DESKTOP OR SAFARI.");

 }

 chunks=[];subtitleChunks=[];

 activeRecordingStamp=new Date().toISOString().replace(/[:.]/g,"-");

 const settings=exportSettings();
 const videoStream=recCanvas.captureStream(30);

 // Обычный REC пишет исходный трек микрофона — это самый совместимый вариант.

  ?audioTracksOverride
  :(micStream?micStream.getAudioTracks().filter(track=>track.readyState==="live"):[]);

  ...avatarVideoTracks,

 });
 recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};

 const recordsSubtitles=tag.startsWith("AI_");
 activeExportJobs=recordsSubtitles?2:1;
 exportProgress=recordsSubtitles?{avatar:0,subtitles:0}:{avatar:0};

 recorder.onstop=async()=>{
  stopTracks(avatarVideoTracks);
  let rawBlob=new Blob(chunks,{type:mime});
  chunks.length=0;
  let blob=rawBlob;
  if(recordsSubtitles){
   setExportProgress("avatar",0);
   try{
    blob=await makeCapCutCompatible(rawBlob,"avatar",settings.br);
   }catch(capCutError){
    console.error("CAPCUT CONVERSION",capCutError);
    warn("CAPCUT-КОДИРОВАНИЕ НЕ ПОДДЕРЖИВАЕТСЯ ЭТИМ БРАУЗЕРОМ. СОХРАНЁН ИСХОДНЫЙ MP4.");
   }
  }
  setDownloadLink(el.downloadZip,blob,`danyapez_avatar_${tag}_${settings.label.replace("×","x")}_${activeRecordingStamp}.mp4`);
  blob=null;
  rawBlob=null;
  recorder=null;
  recCanvas.width=1;
  recCanvas.height=1;
  completeExportJob("avatar");
  if(recordsSubtitles){
   const subtitleStamp=activeRecordingStamp;
   setTimeout(()=>startSubtitleReplayRecording(mime,subtitleStamp),SAFE_EXPORT_MODE?350:80);
  }
 };

 // На мобильном устройстве пишется только один видеопоток за раз.
 recorder.start(1000);
 if(el.teleprompterInput.value.trim())openTeleprompter(true);

 el.format.textContent="MP4";
 el.rec.disabled=true;
 el.aiRec.disabled=true;
 el.stop.disabled=false;
 setStatus("ЗАПИСЬ");
 return true;
}

el.teleprompterInput.value=localStorage.getItem("danyapezTeleprompterText")||"";
el.teleprompterInput.addEventListener("input",saveTeleprompter);
el.teleprompterDelete.onclick=deleteTeleprompter;
el.teleprompterPaste.onclick=pasteTeleprompter;
el.teleprompterClose.onclick=closeTeleprompter;
updateTeleprompterEditorState();
[el.downloadZip,el.downloadSubtitles].forEach(link=>link.addEventListener("click",()=>releaseDownloadedFileLater(link)));
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible"&&screenWakeLockWanted)void keepScreenAwake();
});

let teleDrag=false,teleStartY=0,teleStartScroll=0;
el.teleprompterScroll.addEventListener("pointerdown",e=>{
 teleDrag=true;teleStartY=e.clientY;teleStartScroll=el.teleprompterScroll.scrollTop;teleprompterManualUntil=performance.now()+2500;
 try{el.teleprompterScroll.setPointerCapture(e.pointerId)}catch(_){}
});
el.teleprompterScroll.addEventListener("pointermove",e=>{
 if(!teleDrag)return;el.teleprompterScroll.scrollTop=teleStartScroll-(e.clientY-teleStartY);teleprompterManualUntil=performance.now()+2500;
});
el.teleprompterScroll.addEventListener("pointerup",()=>teleDrag=false);
el.teleprompterScroll.addEventListener("pointercancel",()=>teleDrag=false);

voiceFxEnabled=localStorage.getItem("danyapezAgentZFx")!=="0";
el.voiceDepth.value=localStorage.getItem("danyapezAgentZDepthV4")||"0.25";
setVoiceFxEnabled(voiceFxEnabled);setVoiceDepth(el.voiceDepth.value);
el.voiceFxToggle.onclick=()=>{setVoiceFxEnabled(!voiceFxEnabled);if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume()};
el.voiceDepth.addEventListener("input",()=>setVoiceDepth(el.voiceDepth.value));

function updateSettingLabels(){
 el.scaleValue.value=`${Number(el.scale.value).toFixed(2)}×`;
 el.moveValue.value=el.move.value;
 el.smoothValue.value=`${el.smooth.value}%`;
}
[el.scale,el.move,el.smooth].forEach(input=>input.addEventListener("input",updateSettingLabels));
updateSettingLabels();

el.start.onclick=async()=>{
 try{
  el.start.disabled=true;
  hideWarn();
  await initCamera();
  setStatus("CAMERA ON");
  try{
   await initFace();
   setStatus("TRACKING ON");
  }catch(trackingError){
   console.error(trackingError);
   setStatus("CAMERA ONLY");
   warn("КАМЕРА ВКЛЮЧЕНА, НО ТРЕКИНГ ЛИЦА НЕ ЗАГРУЗИЛСЯ. ПРОВЕРЬТЕ ИНТЕРНЕТ И ОБНОВИТЕ СТРАНИЦУ.");
  }
 }catch(e){
  console.error(e);
  el.start.disabled=false;
  cameraReady=false;
  setStatus("MANUAL MODE");
  warn(String(e.message||e)+". Open in Safari/Chrome directly.");
 }
};

el.rec.onclick=async()=>{
 try{
  hideWarn();
  setStatus("ASK MICROPHONE");
  await ensureMicrophone();
  startRec();
 }catch(e){
  console.error(e);warn("MICROPHONE ERROR: "+e.message);setStatus("MIC ERROR");
 }
};
el.aiRec.onclick=async()=>{
 try{await startAIRecording()}
 catch(e){console.error(e);finishAI();el.aiRec.disabled=false;el.rec.disabled=false;el.stop.disabled=true;warn(String(e.message||e));setStatus("AI ERROR")}
};
el.stop.onclick=()=>{
 aiStopRequested=true;
 if(aiAudioSource){try{aiAudioSource.stop()}catch(_){}}
 stopActiveRecorders();
};

el.showCam.onchange=()=>video.classList.toggle("visible",el.showCam.checked);

await loadSprites();
resizeRec();
stable="static";
render(pctx,preview.width,preview.height,"#000000");
render(rctx,recCanvas.width,recCanvas.height,GREEN);
renderSubtitles(sctx,subtitleCanvas.width,subtitleCanvas.height);
loop();
setStatus("READY");
warmEdgeTTS();
</script>
</body>
</html>
